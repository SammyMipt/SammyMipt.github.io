     x_{t−1} = (x_t − β_t/√(1 − ᾱ_t)·ε̂)/√(1 − β_t) + √β_t·z,
   z гауссов шум, на последнем шаге z = 0; ε̂ есть догадка о шуме,
   который сидит в x_t. Догадку даёт один из трёх знатоков.
     сеть          перцептрон: вход 64 яркости и 16 признаков шага

                   шагов); 82 944 веса вшиты в блок данных выше с

     точный счёт   лучшая догадка для облака самих 1797 картинок:
                   ε̂ = (x_t − √ᾱ_t·Σw_i x_i)/√(1 − ᾱ_t),

}

/* ── строка показаний ──
   Постоянные фразы из счёта sh_ocenka.py: у настоящих цифр, которых
   классификатор не видел, уверенно узнаётся 84 % (пятикратная
   перекрёстная проверка с перемешанными сгибами, три зерна, 0,836);
   соседние картинки выборки различаются на
   12,6 % (медиана); разброс выборки вдоль главных осей 2,80 и 2,56. */
function slova(S) {
  var A = function (x) { return '<span class="accent">' + x + '</span>'; };
  var r2 = function (d) { return num(d[0], 2) + ' и ' + num(d[1], 2); };
  if (S.hod === 'pryamoj') {
    var t = 'Шаг ' + S.t + ' из 1000';
    if (S.t) t += ', β<sub>t</sub> = ' + num(S.beta, 4);
    return t + '. Доля картинки √ᾱ<sub>t</sub> = ' + A(num(S.dolya, S.dolya < 0.1 ? 4 : 2)) +
      ', доля шума √(1 − ᾱ<sub>t</sub>) = ' + num(S.dolyaShuma, 2) + '. Разброс ' + S.tochek +
      ' картинок вдоль главных осей ' + r2(S.dispersii) + ', у гаусса, к которому идёт облако, 1 и 1.';
  }
  var u = 'Шум угадывает ' + ZNATOK_IMYA[S.znatok];
  if (S.t) return u + ', до готовых картинок ' + S.t + ' ' + C.plural(S.t, 'шаг', 'шага', 'шагов') +
    '. Справа ' + S.n + ' ' + C.plural(S.n, 'картинка', 'картинки', 'картинок') + ' на плоскости главных осей, серым выборка.';
  return u + '. Классификатор уверенно узнаёт ' + A(S.uverenno16 + '\u00a0из\u00a016') + ' цифр решётки и ' + S.uverennoVse +
    ' из ' + S.n + ' картинок, а настоящих цифр, которых не видел, 84\u00a0%. Медиана разницы с ближайшей картинкой выборки ' +
    A(num(100 * S.raznVse, 1) + '\u00a0%') + ' яркости на пиксель, у соседних картинок самой выборки 12,6\u00a0%.';
}
/* Самая длинная фраза для запаса высоты строки (без разметки). */
var TEN = (function () {
  var a = slova({ hod: 'obratnyj', znatok: 'tochnyj', t: 0, n: N_GEN, uverenno16: 16, uverennoVse: 32,
                  raznVse: 0.999 });
  var b = slova({ hod: 'pryamoj', t: 1000, beta: 0.0199, dolya: 0.0064, dolyaShuma: 1, tochek: N_PRYAMOJ, dispersii: [9.99, 9.99] });
  var c = a.length > b.length ? a : b;
  return c.replace(/<sub>/g, '').replace(/<[^>]+>/g, '');
})();

function Demka() {
  var tick = useState(0), obnovit = function () { tick[1](function (v) { return v + 1; }); };
  var b, hold = useRef(null);
  if (!hold.current) {
    var z = parseInt(chitat('zerno'), 10); if (!(z >= 0)) z = 31;
    var hod = chitat('hod') === 'obratnyj' ? 'obratnyj' : 'pryamoj';
    var zn = chitat('znatok'); if (!ZNATOKI[zn]) zn = 'set';
    hold.current = { hod: hod, znatok: zn, zerno: z, idet: false, dolg: 0,
                     P: new Pryamoj(z), O: new Obratnyj(zn, z), itog: null, sosedi: null, poslednij: -1, krug: 0 };
  }
  b = hold.current;

  /* Итоги обратного хода: классификатор на конце, соседи всегда. */
  /* Поиск ближайших для всей решётки стоит 5–8 мс, а шаг точного счёта
     около 10 мс, и вместе они не влезают в кадр. Поэтому на ходу кадр
     обновляет соседей двух картинок по кругу, и вся решётка обновляется
     за восемь кадров; на паузе, в начале и в конце хода всегда целиком. */
  function itogi() {
    var O = b.O;
    if (b.poslednij !== O.t && b.idet && O.t !== 0 && b.poslednij >= 0) {
      for (var q = 0; q < 2; q++) {
        b.sosedi[b.krug] = blizhajshaya(O.x, b.krug);
        b.krug = (b.krug + 1) % N_RESHETKA;
      }
      b.itog = null;
      b.poslednij = O.t;
      return;
    }
    var nado = b.poslednij !== O.t;
    if (nado) {
      var sos = [];
      for (var a = 0; a < N_RESHETKA; a++) sos.push(blizhajshaya(O.x, a));
      b.sosedi = sos;
      b.itog = null;
      if (O.t === 0) {
        var uz = [], vse = [], razn = [];
        for (var k = 0; k < O.n; k++) { var u = uznat(O.x, k); vse.push(u); if (k < N_RESHETKA) uz.push(u); }
        for (var k2 = 0; k2 < O.n; k2++) razn.push(blizhajshaya(O.x, k2).razn);
        b.itog = { uz: uz, uverenno16: uz.filter(function (u) { return u.p >= POROG; }).length,
                   uverennoVse: vse.filter(function (u) { return u.p >= POROG; }).length,
                   razn16: mediana(sos.map(function (s) { return s.razn; })), raznVse: mediana(razn) };
      }
      b.poslednij = O.t;
    }
  }

  function sostoyanie() {
    var S = { hod: b.hod, znatok: b.znatok, zerno: b.zerno, idet: b.idet };
    if (b.hod === 'pryamoj') {
      var P = b.P, pts = [];
      for (var a = 0; a < N_PRYAMOJ; a++) pts.push(proekciya(P.x, a));
      var rz = razbros(pts);
      S.t = P.t; S.beta = P.t ? BETA[P.t] : 0; S.dolya = Math.sqrt(ABAR[P.t]); S.dolyaShuma = Math.sqrt(1 - ABAR[P.t]);
      S.dispersii = [rz[0], rz[1]]; S.centr = [rz[2], rz[3]]; S.tochek = N_PRYAMOJ;
    } else {
      itogi();
      var O = b.O;
      S.t = O.t; S.dolya = Math.sqrt(ABAR[O.t]); S.n = O.n;
      S.sosedi = b.sosedi.map(function (s) { return { nomer: s.nomer, razn: s.razn }; });
      var pg = [];
      for (var k = 0; k < O.n; k++) pg.push(proekciya(O.x, k));
      var rg = razbros(pg);
      S.dispersii = [rg[0], rg[1]]; S.centr = [rg[2], rg[3]];
      if (b.itog) {
        S.uverenno16 = b.itog.uverenno16; S.uverennoVse = b.itog.uverennoVse;
        S.razn16 = b.itog.razn16; S.raznVse = b.itog.raznVse;
        S.cifry16 = b.itog.uz.map(function (u) { return u.cifra; });
        S.p16 = b.itog.uz.map(function (u) { return u.p; });
      }
    }
    return S;
  }

  /* Темп: сто шагов в секунду, но счёта на кадр не больше PREDEL_MS.
     Следующий шаг кадр делает, только если он, судя по предыдущему,
     уложится в предел; так кадр не перерастает свои 16,7 мс и ход не
     дёргается, а на слабой машине просто идёт медленнее: несделанные шаги
     не копятся, в следующий кадр переходит не больше одного. Первый шаг
     кадр делает всегда. */
  var PREDEL_MS = 12;
  function step(dt) {
    if (!b.idet) return;
    var H = b.hod === 'pryamoj' ? b.P : b.O;
    b.dolg = Math.min(b.dolg + dt * SHAGOV_V_SEKUNDU, 50);
    var t0 = performance.now(), sdelano = false;
    while (b.dolg >= 1) {
      var t1 = performance.now();
      if (!H.shag()) { b.idet = false; b.dolg = 0; obnovit(); break; }
      b.dolg -= 1; sdelano = true;
      var t2 = performance.now();
      if (t2 - t0 + (t2 - t1) > PREDEL_MS) { b.dolg = Math.min(b.dolg, 1); break; }
    }
    if (sdelano) obnovit();
  }

  function risPloskost(ctx, tone, S) {
    var L = R.pl, i, a;
    ctx.save();
    ctx.beginPath(); ctx.rect(L.x0, L.y0, L.w, L.h); ctx.clip();
    ctx.strokeStyle = 'rgba(' + tone.muted + ',.35)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(L.x0, L.cy); ctx.lineTo(L.x0 + L.w, L.cy);
    ctx.moveTo(L.cx, L.y0); ctx.lineTo(L.cx, L.y0 + L.h); ctx.stroke();
    ctx.setLineDash([5, 5]);
    ctx.strokeStyle = 'rgba(' + tone.muted + ',.8)';
    [1, 2].forEach(function (r) { ctx.beginPath(); ctx.arc(L.cx, L.cy, r * L.m, 0, 2 * Math.PI); ctx.stroke(); });
    ctx.setLineDash([]);
    /* выборка: все 1797 картинок бледно, на месте */
    ctx.fillStyle = 'rgba(' + tone.ink + ',.16)';
    for (i = 0; i < M.n; i++) {
      var p = PROEKCII_VYBORKI[i];
      ctx.fillRect(L.cx + p[0] * L.m - 1, L.cy - p[1] * L.m - 1, 2, 2);
    }
    var x, n, cvet;
    if (b.hod === 'pryamoj') { x = b.P.x; n = N_PRYAMOJ; cvet = '122,166,255'; }
    else { x = b.O.x; n = b.O.n; cvet = '255,122,102'; }
    for (a = n - 1; a >= 0; a--) {
      var q = proekciya(x, a), big = a < N_RESHETKA;
      ctx.fillStyle = 'rgba(' + cvet + ',' + (big ? .95 : .7) + ')';
      ctx.beginPath(); ctx.arc(L.cx + q[0] * L.m, L.cy - q[1] * L.m, big ? 4.2 : 2.8, 0, 2 * Math.PI); ctx.fill();
    }
    ctx.restore();
  }

  function risReshetku(ctx, tone, x, nomera, XY, zagolovok, podpisi) {
    var s = R.kl, g = R.zazor, i;
    C.label(ctx, XY[0], XY[1] - 16, zagolovok, 17, 'rgb(' + tone.muted + ')', 'left');
    for (i = 0; i < N_RESHETKA; i++) {
      var X = XY[0] + (i % 4) * (s + g), Y = XY[1] + Math.floor(i / 4) * (s + R.podpis);
      risKartinku(ctx, tone, x, nomera ? nomera[i] * D : i * D, X, Y, s);
      if (podpisi && podpisi[i]) {
        C.label(ctx, X + s / 2, Y + s + 18, podpisi[i].t, 17, podpisi[i].c, 'center');
      }
    }
  }

  function draw(ctx) {
    var tone = C.tones(ctx), S = sostoyanie();
    window.__demoState = S;
    var ink = 'rgb(' + tone.ink + ')', mut = 'rgb(' + tone.muted + ')', acc = 'rgb(' + tone.accent + ')';
    if (b.hod === 'pryamoj') {
      risReshetku(ctx, tone, M.X0, NOMERA_PRYAMOJ, R.gA, 'в начале', null);
      risReshetku(ctx, tone, b.P.x, null, R.gB, 'на шаге t = ' + S.t, null);
    } else {
      /* На телефоне под картинкой только цифра: проценты налезали на соседей. */
      var pd = null;
      if (b.itog) pd = b.itog.uz.map(function (u) {
        return u.p >= POROG ? { t: UZKO ? String(u.cifra) : u.cifra + ' · ' + Math.round(100 * u.p) + ' %', c: acc } : { t: '?', c: mut };
      });
      risReshetku(ctx, tone, b.O.x, null, R.gA, b.O.t ? 'из шума, шаг t = ' + S.t : 'из шума, готово', pd);
      var nom = b.sosedi.map(function (s) { return s.nomer; });
      var pr = b.sosedi.map(function (s) { return { t: num(100 * s.razn, 0) + ' %', c: s.razn < 0.01 ? acc : mut }; });
      risReshetku(ctx, tone, M.X0, nom, R.gB, 'ближайшая в выборке', pr);
    }
    risPloskost(ctx, tone, S);
    C.label(ctx, R.pl.x0, R.pl.y0 - 8, 'две главные оси выборки', 17, mut, 'left');
    C.readout(ctx, R.ro[0][0], R.ro[0][1], 'ШАГ t', String(S.t), ink);
    C.readout(ctx, R.ro[1][0], R.ro[1][1], 'ДОЛЯ КАРТИНКИ', num(S.dolya, S.dolya < 0.1 ? 4 : 2), acc);
  }

  var ref = C.useStage(R.W, R.H, step, draw);

  /* ── ручки ── */
  function zanovo() {
    b.idet = false; b.dolg = 0;
    if (b.hod === 'pryamoj') b.P = new Pryamoj(b.zerno);
    else { b.O = new Obratnyj(b.znatok, b.zerno); b.poslednij = -1; }
  }
  function postavitHod(h) { if (h !== b.hod) { b.hod = h; b.idet = false; obnovit(); } }
  function postavitZnatok(z) {
    if (z === b.znatok) return;
    b.znatok = z; b.O = new Obratnyj(z, b.zerno); b.poslednij = -1; b.idet = false; obnovit();
  }
  function pusk() {
    var H = b.hod === 'pryamoj' ? b.P : b.O;
    if (b.hod === 'pryamoj' ? H.t >= T : H.t <= 0) zanovo();
    b.idet = !b.idet; obnovit();
  }
  function eshchyo() { b.zerno += 1; zanovo(); obnovit(); }

  /* Для автопроверки. __demoSet({ hod, znatok, zerno, shagov, n }) ставит
     ручки и делает shagov шагов без анимации (n меняет число картинок
     обратного хода, только для сверки); __demoModel даёт счёт. */
  window.__demoSet = function (o) {
    o = o || {};
    if (o.hod) b.hod = o.hod === 'obratnyj' ? 'obratnyj' : 'pryamoj';
    if (o.znatok && ZNATOKI[o.znatok]) b.znatok = o.znatok;
    if (o.zerno != null) b.zerno = o.zerno;
    b.idet = false;
    if (b.hod === 'pryamoj') b.P = new Pryamoj(b.zerno);
    else { b.O = new Obratnyj(b.znatok, b.zerno, o.n); b.poslednij = -1; }
    var H = b.hod === 'pryamoj' ? b.P : b.O;
    for (var k = 0; k < (o.shagov || 0); k++) if (!H.shag()) break;
    window.__demoState = sostoyanie();
    obnovit();
    return window.__demoState;
  };
  window.__demoModel = { M: M, BETA: BETA, ABAR: ABAR, ZNATOKI: ZNATOKI, Gauss: Gauss, mulberry32: mulberry32,
                         Pryamoj: Pryamoj, Obratnyj: Obratnyj, uznat: uznat, blizhajshaya: blizhajshaya,
                         proekciya: proekciya, NOMERA_PRYAMOJ: NOMERA_PRYAMOJ };
  window.__demoKartinki = function () {
    return Array.prototype.slice.call((b.hod === 'pryamoj' ? b.P : b.O).x);
  };



  var S = window.__demoState || sostoyanie();
  var H0 = b.hod === 'pryamoj' ? b.P : b.O, konec = b.hod === 'pryamoj' ? H0.t >= T : H0.t <= 0;
  return html`
    <div class="demo">
      <div class="controls">
        <${C.Group} label="Ход:">
          <${C.Btn} active=${b.hod === 'pryamoj'} onClick=${function () { postavitHod('pryamoj'); }}>прямой<//>
          <${C.Btn} active=${b.hod === 'obratnyj'} onClick=${function () { postavitHod('obratnyj'); }}>обратный<//>
        <//>
        <${C.Group} label="Шум угадывает:">
          ${['set', 'tochnyj', 'gauss'].map(function (z) {
            return html`<${C.Btn} key=${z} active=${b.znatok === z && b.hod === 'obratnyj'} disabled=${b.hod !== 'obratnyj'}
                                 onClick=${function () { postavitZnatok(z); }}>${ZNATOK_IMYA[z]}<//>`;
          })}
        <//>
        <${C.Group}>
          <${C.Btn} action=${true} onClick=${pusk}>${b.idet ? 'Пауза' : konec ? 'Ещё раз' : 'Пуск'}<//>
          <${C.Btn} onClick=${eshchyo}>Новый шум<//>
        <//>
      </div>
      <canvas class="stage" ref=${ref}></canvas>
      <div class="status shum-status" data-ten=${TEN}>
        <span dangerouslySetInnerHTML=${{ __html: slova(S) }}></span>
      </div>
    </div>`;
}

C.mount(Demka);
</script>
</body>
</html>
