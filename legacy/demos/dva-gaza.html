   Энергия идёт с одной стороны на другую только через качания пластины;
   температура в счёт не входит, показания снимаются с энергий: ⅔⟨ε_пост⟩

   НАИБОЛЬШАЯ СУММА при той же энергии двух газов: равные энергии и равные
   объёмы, то есть равные температуры и давления,
       S_max = 1,5 N₁ k (ln(Ē/E₁⁰) + ln(Ē/E₂⁰)),  Ē = (E₁ + E₂)/2.
   Сумма выше неё не бывает по построению (сумма вогнутых функций), и

   стороны», а пластина с пружиной стоит рядом своей строкой.

   ЧЕГО ЖДАТЬ, для сравнения, в счёт не входит. Сохранение энергии с

/* ══════════════════ двенадцатая неделя, ?nedelya=12 ══════════════════

   briefs/lekciya12_resheniya_ramki.md, п. 11). Счёт газа и пластины тот

   СТАРТ. Обе стороны при ⅔⟨ε_пост⟩ = KT12 = 1: смотреть надо на пластину,
   а выравнивание температур показывает девятая. Прежний старт 2 и 0,5

   газ тормозит её трением ζ ≈ 4n√(mkT/2π) с каждой стороны, 479 + 1514 ≈

   ПОКАЗАНИЯ. Среднее по окну ⟨½MU²⟩/kT = Σ½MU²/ΣkT, kT каждой выборки есть
   средняя ⅔⟨ε_пост⟩ двух сторон, то есть ⅔⟨ε⟩ всех шестисот (так считает
   опись). Отношение √⟨vₓ²⟩ лёгких к √⟨U²⟩ пластины против √(M/m₁). Среднее

   одной энергии системы вероятность сдвига идёт как e^{S(ξ)/k}; у
   идеального газа это добавка к жёсткости K_газ = 2NkT/V² = 625 при kT = 1

   единицы окна (NPOKAZ = 20 выборок).

   ПРОВЕРКА (13.11; briefs/lekciya12_skripty/proizvodstvo/plastina.py с
   вырезкой этого счёта в node, plastina_model.js; hcheck на порту 49967,

   Старт описи, масса 20, зёрна 1 и 2, окно 50–300: ⟨½MU²⟩ 0,5112 и

   масса 5 0,497 (0,486–0,511), 20 0,506 (0,491–0,516), 200 0,507
   (0,481–0,553); отношение скоростей 2,24; 4,44; 14,07 против 2,236;
   4,472; 14,142; пружина 0,32–0,46 kT, в среднем 0,36–0,39 против оценки
   0,381; учёт энергии до 1,3·10⁻¹⁵. Разброс среднего между зёрнами у
   массы 20 (тридцать зёрен 101–130): σ 0,052; 0,034; 0,024; 0,017 за 10,
   20, 40, 75 единиц, за 75 единиц 5–95 % от 0,471 до 0,522; у массы 200

   потока, 3000 единиц, два зерна): от 0,497 до 0,505 kT при погрешности

   и проверка kT/2 падает. В браузере траектория расходится с node с первой
   выборки в последнем знаке энергии пластины (округление разных V8), и
   хаос ударов уводит её; страница при том же зерне повторяет себя
   побайтно, а её средние те же по статистике: старт описи 0,505 и 0,495
   kT, старт показа 0,491. Регрессия: без параметра и с ?nedelya=10
   вырезка счёта из файла до правки (git HEAD) и из этого даёт побайтно
   одинаковые __demoState на 4400 выборках при четырёх наборах (пластина
   20, 5, 200, закреплённая); в hcheck при остановленном rAF состояние,
   строка, рейка и хеш канвы после 400 тиков совпали без параметра, с

var N1 = 300, M1 = 1, M2 = 10, KT1 = 2, KT2 = 0.5, K = 2000, ETA = 0.01;
var M_MIN = 5, M_MAX = 200, M_DEF = 20;
var SKOROST = 2.5;        /* единиц модели в секунду экрана */
var DT_S = 0.05;          /* шаг выборки */
var OKNO = 60;            /* окно графика, единиц */
var TAU_E = 1;            /* сглаживание показаний */
var CL = '77,182,198', CT = '224,138,82';
var KT12 = 1, T0_12 = 2, NPOKAZ = 20;  /* двенадцатая: общая начальная ⅔⟨ε_пост⟩, начало окна средних, выборок до показа среднего */

function ema(o, k, x, a) {
  o[k] = (o[k] || 0) * (1 - a) + a * x;
  o[k + 'W'] = (o[k + 'W'] || 0) * (1 - a) + a;
  return o[k] / o[k + 'W'];
}

/* Начальная ⅔⟨ε_пост⟩ стороны s (0 лёгкие, 1 тяжёлые). У девятой и десятой
   2 и 0,5; у двенадцатой одна KT12 на обе стороны, а прежний старт
   остаётся заданием start: 'raznye' для сверки с описью (__demoSet). */
function kTstarta(p, s) {
  if (NED12 && p.start !== 'raznye') return KT12;
  return s ? KT2 : KT1;
}

function novyj(p) {
  var N = 2 * N1;
  var M = { p: p, buf: new Float64Array(3 * N), sled: [], em: {}, tE: null, nakop: 0 };
  M.g = G.create({ N: N, N1: N1, X: 2, eta: ETA, seed: p.seed,
                   m: function (i) { return i < N1 ? M1 : M2; }, kT: function (i) { return kTstarta(p, i < N1 ? 0 : 1); },
                   plate: { X0: 1, M: p.plateMass, K: K, fixed: p.fixed } });
  M.kTfin = M.g.energy() / (1.5 * N + (p.fixed ? 0 : 1));
  if (NED12) {
    /* накопители средних пластины: k номер выборки (у выборки в момент t он
       равен t/DT_S, нулевая снимается при создании), в окно идут k > k0 */
    M.pl = { k: -1, k0:Math.round(t0Plastiny(p) / DT_S), n: 0, sE: 0, sP: 0, sK: 0, sU2: 0, sX2: 0,
             em: {}, sled: [], ek: 0, kT: 1 };
  }
  if (NED10) {
    /* точка отсчёта энтропии: энергии сторон и объём центров в начале */
    var q0 = storony(M.g);
    M.E0 = [1.5 * N1 * q0.kT[0], 1.5 * N1 * q0.kT[1]];
    M.V0 = 1 - M.g.d / 2;
    M.sledS = [];
  }
  vyborka(M, true);
  return M;
}
function storony(g) {
  var e = [0, 0], v = [0, 0], i;
  for (i = 0; i < g.N; i++) {
    var v2 = g.vx[i] * g.vx[i] + g.vy[i] * g.vy[i] + g.vz[i] * g.vz[i], s = i < N1 ? 0 : 1;
    e[s] += 0.5 * g.m[i] * v2; v[s] += v2;
  }
  return { kT: [2 * e[0] / (3 * N1), 2 * e[1] / (3 * N1)], vr: [Math.sqrt(v[0] / N1), Math.sqrt(v[1] / N1)] };
}
function vyborka(M, nul) {
  if (!nul) M.g.advance(DT_S);
  var q = storony(M.g), a = DT_S / TAU_E;
  M.now = q;
  M.kT = [ema(M.em, 'k0', q.kT[0], a), ema(M.em, 'k1', q.kT[1], a)];
  M.vr = [ema(M.em, 'v0', q.vr[0], a), ema(M.em, 'v1', q.vr[1], a)];
  M.sled.push([M.g.t, q.kT[0], q.kT[1], q.vr[0], q.vr[1]]);
  while (M.sled.length && M.sled[0][0] < M.g.t - OKNO) M.sled.shift();
  /* время, когда сглаженная разность упала в e раз от начальной 1,5 */
  if (M.tE == null && !M.p.fixed && M.kT[0] - M.kT[1] < (KT1 - KT2) / Math.E) M.tE = M.g.t;
  if (NED10) entropiya(M, q);
  if (NED12) plastina(M, q);
}

/* Двенадцатая неделя: средние пластины с выборки k0 + 1 (шапка,
   «ДВЕНАДЦАТАЯ НЕДЕЛЯ»). kT газа берётся из той же выборки, средней
   ⅔⟨ε_пост⟩ двух сторон (стороны равны по числу молекул, это ⅔⟨ε⟩ всех
   шестисот), и усредняется по тому же окну, как в описи (gaz12.py, Е). */
function plastina(M, q) {
  var A = M.pl, g = M.g, P = g.plate(), i, vx2 = 0;
  var ek = 0.5 * P.M * P.U * P.U, kT = 0.5 * (q.kT[0] + q.kT[1]);
  for (i = 0; i < N1; i++) vx2 += g.vx[i] * g.vx[i];
  A.k += 1; A.ek = ek; A.kT = kT;
  if (A.k > A.k0) {
    A.n += 1; A.sE += ek; A.sP += 0.5 * P.K * P.xi * P.xi; A.sK += kT;
    A.sU2 += P.U * P.U; A.sX2 += vx2 / N1;
  }
  /* график: ½MU²/kT, сглаженное по одной единице, и среднее с начала окна;
     среднее рисуется и печатается после первой единицы окна (NPOKAZ
     выборок), раньше оно держится на десятке выборок и прыгает */
  A.sled.push([g.t, ema(A.em, 'e', ek / kT, DT_S / TAU_E), A.n >= NPOKAZ ? A.sE / A.sK : null]);
  while (A.sled.length && A.sled[0][0] < g.t - OKNO) A.sled.shift();
}

/* С какой единицы времени копить средние пластины. Пластина стартует
   стоя, газ трением разгоняет её за доли единицы даже при массе 200
   (шапка), поэтому при одной температуре окно открывается с t = T0_12.
   Старт описи (2 и 0,5) ждёт выравнивания газов, как gaz12.py: с t = 50. */
function t0Plastiny(p) {
  return p.start === 'raznye' ? 50 : T0_12;
}

/* Десятая неделя: энтропия сторон по энергии и объёму, их сумма и
   наибольшая сумма при той же энергии газов (шапка, «ДЕСЯТАЯ НЕДЕЛЯ»).
   Мгновенные значения идут в график и в __demoState, сглаженные по одной
   единице времени, как остальные показания, в строку под сценой. */
function entropiya(M, q) {
  var g = M.g, d = g.d, X = g.plate().X, a = DT_S / TAU_E;
  var E1 = 1.5 * N1 * q.kT[0], E2 = 1.5 * N1 * q.kT[1];
  var V1 = X - d / 2, V2 = 2 - X - d / 2;
  var S1 = N1 * (1.5 * Math.log(E1 / M.E0[0]) + Math.log(V1 / M.V0));
  var S2 = N1 * (1.5 * Math.log(E2 / M.E0[1]) + Math.log(V2 / M.V0));
  var Em = 0.5 * (E1 + E2);
  var Smax = 1.5 * N1 * (Math.log(Em / M.E0[0]) + Math.log(Em / M.E0[1]));
  var P = g.plate();
  M.S = { S1: S1, S2: S2, sum: S1 + S2, max: Smax, E1: E1, E2: E2, V1: V1, V2: V2,
          sumSm: ema(M.em, 'sS', S1 + S2, a), defSm: ema(M.em, 'sD', Smax - S1 - S2, a),
          pESm: ema(M.em, 'sP', P.E, a), pXSm: ema(M.em, 'sX', P.X, a), maxSm: ema(M.em, 'sM', Smax, a) };
  M.sledS.push([g.t, S1, S2, S1 + S2, Smax]);
  while (M.sledS.length && M.sledS[0][0] < g.t - OKNO) M.sledS.shift();
}

/* Время свободного пробега на стороне при её kT и объёме: та же формула
   с множителем Энскога, что в демке «Поршень и молекулы» (G.chi). */
function probeg(kT, m, V, d) {
  var n = N1 / V, eta = n * Math.PI * d * d * d / 6, vs = Math.sqrt(8 * kT / (Math.PI * m));
  return 1 / (Math.SQRT2 * Math.PI * d * d * n * vs * G.chi(eta));
}

function sostoyanie(M) {
  var g = M.g, P = g.plate();
  var r = {
    mode: M.p.fixed ? 'fixed' : 'spring', m1: M1, m2: M2, N1: N1, N2: N1, kT1: M.kT[0], kT2: M.kT[1],
    kT1now: M.now.kT[0], kT2now: M.now.kT[1], vrms1: M.vr[0], vrms2: M.vr[1], ratio: M.vr[0] / M.vr[1],
    ratioTheory: Math.sqrt(M2 / M1), plateMass: M.p.plateMass, fixed: M.p.fixed, kTfinal: M.kTfin,
    tau: M.tE, t: g.t, plateX: P.X, plateE: P.E, plateHits: g.plateHits, drift: g.drift(), nEv: g.nEv
  };
  if (NED10 && M.S) {
    var s = M.S, d = g.d;
    /* энтропия в k; Eout и Ein в единицах энергии модели (масса 1, kT₁ = 2) */
    Object.assign(r, {
      nedelya: 10, S1: s.S1, S2: s.S2, Ssum: s.sum, SsumMax: s.max, deficit: s.max - s.sum,
      SsumSm: s.sumSm, deficitSm: s.defSm, SsumMaxSm: s.maxSm, perMol: s.sumSm / (2 * N1),
      SsumExpect: 1.5 * N1 * (Math.log(M.kTfin / KT1) + Math.log(M.kTfin / KT2)),
      V1: s.V1, V2: s.V2, E1: s.E1, E2: s.E2, Eout: M.E0[0] - s.E1, Ein: s.E2 - M.E0[1],
      EoutSm: M.E0[0] - 1.5 * N1 * M.kT[0], plateESm: s.pESm, plateXSm: s.pXSm,
      tauFree1: probeg(M.kT[0], M1, s.V1, d), tauFree2: probeg(M.kT[1], M2, s.V2, d)
    });
  }
  if (NED12 && M.pl) {
    var A = M.pl, n = A.n;
    /* средние окна в kT: кинетическая энергия пластины (её табло), энергия
       пружины (на экран не идёт, шапка), отношение скоростей лёгкой
       молекулы вдоль x и пластины против √(M/m₁) */
    Object.assign(r, {
      nedelya: 12, tau: null, start: M.p.start === 'raznye' ? 'raznye' : 'odna', kTstart: [kTstarta(M.p, 0), kTstarta(M.p, 1)],
      okno0: A.k0 * DT_S, oknoN: n, oknoDlina: n * DT_S,
      plateEk: A.ek, plateEkKT: A.ek / A.kT, kTgaz: A.kT,
      plateEkAvg: n ? A.sE / n : null, kTavg: n ? A.sK / n : null,
      plateEkAvgKT: n ? A.sE / A.sK : null, plateEpAvgKT: n ? A.sP / A.sK : null,
      ratioU: n && A.sU2 > 0 ? Math.sqrt(A.sX2 / A.sU2) : null, ratioUTheory: Math.sqrt(M.p.plateMass / M1)
    });
  }
  return r;
}

function num(v, d) {
  if (v == null || !isFinite(v)) return '—';
  if (Math.abs(v) < 0.5 * Math.pow(10, -d)) v = 0;
  return v.toFixed(d).replace('.', ',').replace('-', '−');
}

/* ══════════════════ сцена ══════════════════

   Слева ящик сбоку: лёгкие молекулы бирюзой, тяжёлые охрой, посередине
   пластина и над ней пружина. Справа два графика по времени: ⅔⟨ε_пост⟩
   каждой стороны с пунктиром ожидаемого общего значения и √⟨v²⟩.
   Внизу показания, сглаженные по одной единице времени. */

var W = 1000, HGT = 460;
var BX = 30, BY = 96, B = 200;                      /* ящик центров 2B × B */
var GX0 = 580, GX1 = 980, G1Y0 = 40, G1Y1 = 170, G2Y0 = 214, G2Y1 = 330;

var pokaz = {};
window.__demoState = pokaz;

function DvaGaza() {
  var box = useRef(null);
  if (!box.current) {
    var p0 = { plateMass: M_DEF, fixed: false, seed: (Math.random() * 4294967296) >>> 0 };
    box.current = { p: p0, M: novyj(p0), nakop: 0 };
  }
  var S = box.current;
  var pair = useState({ n: 0 });
  var setUi = pair[1];
  var ui = useRef({ last: 0 });

  function snyat() {
    var q = sostoyanie(S.M);
    for (var k in pokaz) delete pokaz[k];
    Object.assign(pokaz, q);
  }
  if (pokaz.N1 == null) snyat();

  function zanovo(o) {
    Object.assign(S.p, o || {});
    if (!o || o.seed == null) S.p.seed = (Math.random() * 4294967296) >>> 0;
    S.M = novyj(S.p); S.nakop = 0;
    snyat(); setUi(function (u) { return { n: u.n + 1 }; });
  }

  function step(dt) {
    S.nakop += Math.min(dt, 0.05) * SKOROST;
    while (S.nakop >= DT_S) { vyborka(S.M); S.nakop -= DT_S; }
    snyat();
    ui.current.last += dt;
    if (ui.current.last > 0.5) { ui.current.last = 0; setUi(function (u) { return { n: u.n + 1 }; }); }
  }

  /* ── рисунок ── */

  function sub(ctx, x, y, a, s, b, size, color, align) {
    ctx.font = size + 'px "Golos Text", system-ui, sans-serif';
    var wa = ctx.measureText(a).width, wb = ctx.measureText(b).width;
    ctx.font = Math.round(size * 0.7) + 'px "Golos Text", system-ui, sans-serif';
    var ws = ctx.measureText(s).width, wt = wa + ws + wb;
    var x0 = align === 'left' ? x : align === 'right' ? x - wt : x - wt / 2;
    C.label(ctx, x0, y, a, size, color, 'left');
    C.label(ctx, x0 + wa, y + size * 0.25, s, Math.round(size * 0.7), color, 'left');
    C.label(ctx, x0 + wa + ws, y, b, size, color, 'left');
  }

  /* Подпись показания тем же шрифтом и цветом, что у C.readout, но с
     нижним индексом, как у подписи графика: ⅔⟨ε_пост⟩. Выравнивание
     по правому краю, как у readout. */
  function podpisSub(ctx, x, y, a, s, b) {
    var F = '600 15px "JetBrains Mono", ui-monospace, monospace';
    var Fs = '600 11px "JetBrains Mono", ui-monospace, monospace';
    ctx.font = F;
    var wa = ctx.measureText(a).width, wb = ctx.measureText(b).width;
    ctx.font = Fs;
    var ws = ctx.measureText(s).width, x0 = x - wa - ws - wb;
    ctx.textAlign = 'left';
    ctx.fillStyle = '#8c93ac';
    ctx.font = F; ctx.fillText(a, x0, y);
    ctx.font = Fs; ctx.fillText(s, x0 + wa, y + 4);
    ctx.font = F; ctx.fillText(b, x0 + wa + ws, y);
    ctx.textAlign = 'center';
  }

  function yashchik(ctx, M, ink, mut) {
    var g = M.g, r = g.d / 2 * B, rr = Math.max(1.6, r), p = g.pos(M.buf), P = g.plate(), i, L;
    var xl = BX - r, yt = BY - r, w = 2 * B + 2 * r, hh = B + 2 * r;
    ctx.strokeStyle = 'rgba(' + ink + ',.75)'; ctx.lineWidth = 2; ctx.strokeRect(xl, yt, w, hh);
    for (L = 0; L < 5; L++) {
      [[0, CL], [1, CT]].forEach(function (sc) {
        ctx.fillStyle = 'rgba(' + sc[1] + ',' + (0.35 + 0.15 * L).toFixed(2) + ')';
        ctx.beginPath();
        for (i = sc[0] * N1; i < (sc[0] + 1) * N1; i++) {
          if (Math.min(4, Math.floor(p[3 * i + 2] * 5)) !== L) continue;
          var px = BX + p[3 * i] * B, py = BY + (1 - p[3 * i + 1]) * B;
          ctx.moveTo(px + rr, py); ctx.arc(px, py, rr, 0, 2 * Math.PI);
        }
        ctx.fill();
      });
    }
    /* пластина и пружина над ней: от неподвижной опоры к верху пластины */
    var xp = BX + P.X * B;
    ctx.fillStyle = 'rgba(' + ink + ',.85)'; ctx.fillRect(xp - 3, yt - 18, 6, hh + 18);
    var y0 = yt - 30, xa = BX + B - 70;
    ctx.strokeStyle = 'rgba(' + ink + ',.85)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(xa, y0 - 14); ctx.lineTo(xa, y0 + 14); ctx.stroke();
    if (!M.p.fixed) {
      ctx.lineWidth = 1.6; ctx.beginPath(); ctx.moveTo(xa, y0);
      var n = 10, x1 = xp - 10, dx = (x1 - xa - 10) / n;
      ctx.lineTo(xa + 10, y0);
      for (i = 0; i < n; i++) ctx.lineTo(xa + 10 + (i + 0.5) * dx, y0 + (i % 2 ? 7 : -7));
      ctx.lineTo(x1, y0); ctx.lineTo(xp, y0); ctx.lineTo(xp, yt - 18); ctx.stroke();
    } else {
      ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(xa, y0); ctx.lineTo(xp, y0); ctx.lineTo(xp, yt - 18); ctx.stroke();
    }
    C.label(ctx, BX + B / 2, BY + B + 34, 'лёгкие, масса 1', 17, 'rgb(' + CL + ')');
    C.label(ctx, BX + 1.5 * B, BY + B + 34, 'тяжёлые, масса 10', 17, 'rgb(' + CT + ')');
    C.label(ctx, BX + B, 28, M.p.fixed ? 'пластина закреплена' : 'пластина на пружине, масса ' + num(M.p.plateMass, 0), 17, 'rgba(' + mut + ',.95)');
  }

  function grafik(ctx, M, k0, k1, y0, y1, ymax, zag, linia, ink, mut) {
    var t1 = Math.max(OKNO, M.g.t), t0 = t1 - OKNO, sx = (GX1 - GX0) / OKNO, sy = (y1 - y0) / ymax;
    ctx.strokeStyle = 'rgba(' + ink + ',.5)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(GX0, y0); ctx.lineTo(GX0, y1); ctx.lineTo(GX1, y1); ctx.stroke();
    zag(y0 - 14);
    for (var v = 1; v <= ymax; v++) C.label(ctx, GX0 - 7, y1 - v * sy + 6, String(v), 17, 'rgba(' + mut + ',.95)', 'right');
    if (linia != null) {
      ctx.save(); ctx.setLineDash([6, 4]); ctx.strokeStyle = 'rgba(' + ink + ',.8)'; ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.moveTo(GX0, y1 - linia * sy); ctx.lineTo(GX1, y1 - linia * sy); ctx.stroke(); ctx.restore();
    }
    [[k0, CL], [k1, CT]].forEach(function (kc) {
      ctx.strokeStyle = 'rgb(' + kc[1] + ')'; ctx.lineWidth = 1.8; ctx.beginPath();
      M.sled.forEach(function (s, i) {
        var X = GX0 + (s[0] - t0) * sx, Y = y1 - Math.min(ymax, s[kc[0]]) * sy;
        if (i) ctx.lineTo(X, Y); else ctx.moveTo(X, Y);
      });
      ctx.stroke();
    });
  }

  /* Десятая неделя: график энергий короче, под ним энтропия сторон в k
     от точки старта, их сумма и пунктиром наибольшая сумма при той же
     энергии газов. Пунктир серый поверх линии суммы: в равновесии он
     ложится на неё, и цветом чернил его бы не было видно, а цвет акцента
     в одной теме совпал бы с лёгкими, в другой с тяжёлыми. */
  var G1Y1_10 = 140, G2Y0_10 = 196, SMIN = -260, SMAX = 460;
  function grafikS(ctx, M, y0, y1, ink, mut) {
    var t1 = Math.max(OKNO, M.g.t), t0 = t1 - OKNO, sx = (GX1 - GX0) / OKNO, sy = (y1 - y0) / (SMAX - SMIN), v;
    function Y(s) { return y1 - (Math.max(SMIN, Math.min(SMAX, s)) - SMIN) * sy; }
    ctx.strokeStyle = 'rgba(' + ink + ',.5)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(GX0, y0); ctx.lineTo(GX0, y1); ctx.lineTo(GX1, y1); ctx.stroke();
    ctx.strokeStyle = 'rgba(' + ink + ',.22)';
    ctx.beginPath(); ctx.moveTo(GX0, Y(0)); ctx.lineTo(GX1, Y(0)); ctx.stroke();
    for (v = -200; v <= SMAX; v += 200) C.label(ctx, GX0 - 7, Y(v) + 6, num(v, 0), 17, 'rgba(' + mut + ',.95)', 'right');
    [[1, CL, 1.8], [2, CT, 1.8], [3, ink, 2.4]].forEach(function (kc) {
      ctx.strokeStyle = 'rgb(' + kc[1] + ')'; ctx.lineWidth = kc[2]; ctx.beginPath();
      M.sledS.forEach(function (s, i) {
        var X = GX0 + (s[0] - t0) * sx;
        if (i) ctx.lineTo(X, Y(s[kc[0]])); else ctx.moveTo(X, Y(s[kc[0]]));
      });
      ctx.stroke();
    });
    ctx.save(); ctx.setLineDash([6, 4]); ctx.strokeStyle = 'rgba(' + mut + ',.95)'; ctx.lineWidth = 2; ctx.beginPath();
    M.sledS.forEach(function (s, i) {
      var X = GX0 + (s[0] - t0) * sx;
      if (i) ctx.lineTo(X, Y(s[4])); else ctx.moveTo(X, Y(s[4]));
    });
    ctx.stroke(); ctx.restore();
  }
  function risovat10(ctx, M, q, tone, m) {
    var ink = tone.ink, mut = tone.muted, Y = 384;
    grafik(ctx, M, 1, 2, G1Y0, G1Y1_10, 2.2, function (y) { sub(ctx, GX0, y, '⅔⟨ε', 'пост', '⟩ каждой стороны и общее пунктиром', 17, m, 'left'); },
           q.fixed ? null : q.kTfinal, ink, mut);
    C.label(ctx, GX0, G2Y0_10 - 14, 'ΔS каждой стороны и их сумма, k', 17, m, 'left');
    grafikS(ctx, M, G2Y0_10, G2Y1, ink, mut);
    C.label(ctx, GX0, G2Y1 + 22, 'пунктир: наибольшая сумма', 17, m, 'left');
    C.label(ctx, GX1, G2Y1 + 22, 'последние ' + OKNO + ' единиц', 17, m, 'right');
    C.readout(ctx, 190, Y, 'РОСТ СУММЫ, k', num(q.SsumSm, 1), 'rgb(' + ink + ')');
    C.label(ctx, 190, Y + 66, num(q.perMol, 3) + ' k на молекулу', 17, m, 'right');
    C.readout(ctx, 390, Y, 'ДО НАИБОЛЬШЕЙ, k', num(q.deficitSm, 1), 'rgb(' + ink + ')');
    C.label(ctx, 390, Y + 66, 'наибольшая ' + num(q.SsumMaxSm, 1), 17, m, 'right');
    C.readout(ctx, 590, Y, 'УШЛО С ГОРЯЧЕЙ', num(q.EoutSm, 0), 'rgb(' + CL + ')');
    C.label(ctx, 590, Y + 66, 'энергии было 900', 17, m, 'right');
    C.readout(ctx, 790, Y, 'ПЛАСТИНА С ПРУЖИНОЙ', num(q.plateESm, 1), 'rgb(' + ink + ')');
    C.label(ctx, 790, Y + 66, q.fixed ? 'закреплена' : 'место x = ' + num(q.plateXSm, 2), 17, m, 'right');
    C.readout(ctx, 990, Y, 'ПРОБЕГ', num(q.tauFree1, 2) + '/' + num(q.tauFree2, 2), 'rgb(' + ink + ')');
    C.label(ctx, 990, Y + 66, q.fixed ? 'обмена нет' : q.tau != null ? 'разность в e раз: ' + num(q.tau, 0) : 'выравнивание идёт', 17, m, 'right');
    ctx.textAlign = 'center';
  }

  /* Двенадцатая неделя: верхний график прежний, нижний показывает
     кинетическую энергию пластины в kT, сглаженную по одной единице
     (тонкая линия чернил), и её среднее с начала окна (жирная линия цвета
     табло); пунктир на уровне 0,5. Энергию пружины экран не показывает. */
  var EKMAX = 2, CEK = '255,180,84';
  function grafik12(ctx, M, y0, y1, ink, mut) {
    var A = M.pl, t1 = Math.max(OKNO, M.g.t), t0 = t1 - OKNO, sx = (GX1 - GX0) / OKNO, sy = (y1 - y0) / EKMAX, v;
    function Y(e) { return y1 - Math.max(0, Math.min(EKMAX, e)) * sy; }
    ctx.strokeStyle = 'rgba(' + ink + ',.5)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(GX0, y0); ctx.lineTo(GX0, y1); ctx.lineTo(GX1, y1); ctx.stroke();
    for (v = 0.5; v <= EKMAX; v += 0.5) C.label(ctx, GX0 - 7, Y(v) + 6, num(v, 1), 17, 'rgba(' + mut + ',.95)', 'right');
    ctx.strokeStyle = 'rgba(' + ink + ',.55)'; ctx.lineWidth = 1.4; ctx.beginPath();
    A.sled.forEach(function (s, i) { var X = GX0 + (s[0] - t0) * sx; if (i) ctx.lineTo(X, Y(s[1])); else ctx.moveTo(X, Y(s[1])); });
    ctx.stroke();
    ctx.strokeStyle = 'rgb(' + CEK + ')'; ctx.lineWidth = 2.6; ctx.beginPath();
    var nach = false;
    A.sled.forEach(function (s) {
      if (s[2] == null) return;
      var X = GX0 + (s[0] - t0) * sx;
      if (nach) ctx.lineTo(X, Y(s[2])); else { ctx.moveTo(X, Y(s[2])); nach = true; }
    });
    ctx.stroke();
    /* Пунктир kT/2 поверх среднего: к концу показа среднее ложится на 0,5,
       и снизу пунктир под жирной линией пропадал. */
    ctx.save(); ctx.setLineDash([6, 4]); ctx.strokeStyle = 'rgba(' + ink + ',.95)'; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.moveTo(GX0, Y(0.5)); ctx.lineTo(GX1, Y(0.5)); ctx.stroke(); ctx.restore();
  }
  function risovat12(ctx, M, q, m, ink, mut) {
    grafik(ctx, M, 1, 2, G1Y0, G1Y1, 2.2, function (y) { sub(ctx, GX0, y, '⅔⟨ε', 'пост', '⟩ каждой стороны', 17, m, 'left'); },
           null, ink, mut);
    C.label(ctx, GX0, G2Y0 - 14, '½MU² пластины в kT и среднее', 17, m, 'left');
    grafik12(ctx, M, G2Y0, G2Y1, ink, mut);
    C.label(ctx, GX0, G2Y1 + 22, 'пунктир: kT/2', 17, m, 'left');
    C.label(ctx, GX1, G2Y1 + 22, 'последние ' + OKNO + ' единиц', 17, m, 'right');
    var Y = 384;
    C.readout(ctx, 190, Y, '', num(q.kT1, 2), 'rgb(' + CL + ')');
    podpisSub(ctx, 190, Y, '⅔⟨ε', 'пост', '⟩ СЛЕВА');
    C.label(ctx, 190, Y + 66, 'было ' + num(q.kTstart[0], 1), 17, m, 'right');
    C.readout(ctx, 390, Y, '', num(q.kT2, 2), 'rgb(' + CT + ')');
    podpisSub(ctx, 390, Y, '⅔⟨ε', 'пост', '⟩ СПРАВА');
    C.label(ctx, 390, Y + 66, 'было ' + num(q.kTstart[1], 1), 17, m, 'right');
    var est = !q.fixed && q.oknoN >= NPOKAZ;
    C.readout(ctx, 640, Y, '⟨½MU²⟩ ПЛАСТИНЫ, kT', est ? num(q.plateEkAvgKT, 2) : '—', 'rgb(' + CEK + ')');
    C.label(ctx, 640, Y + 66, q.fixed ? 'пластина стоит' : est ? 'среднее за ' + num(q.oknoDlina, 0) + ' ' + C.plural(Math.round(q.oknoDlina), 'единицу', 'единицы', 'единиц') : 'среднее с t = ' + num(q.okno0, 0), 17, m, 'right');
    C.readout(ctx, 840, Y, 'ЛЁГКИЕ БЫСТРЕЕ', est ? num(q.ratioU, 2) : '—', 'rgb(' + ink + ')');
    C.label(ctx, 840, Y + 66, q.fixed ? '' : '√' + q.plateMass + ' = ' + num(q.ratioUTheory, 2), 17, m, 'right');
    C.readout(ctx, 990, Y, 'ВРЕМЯ', num(q.t, 0), 'rgb(' + ink + ')');
    C.label(ctx, 990, Y + 66, 'единиц модели', 17, m, 'right');
    ctx.textAlign = 'center';
  }

  function draw(ctx) {
    var tone = C.tones(ctx), ink = tone.ink, mut = tone.muted, M = S.M, q = pokaz, m = 'rgba(' + mut + ',.95)';
    if (q.N1 == null) return;
    yashchik(ctx, M, ink, mut);
    if (NED12) { risovat12(ctx, M, q, m, ink, mut); return; }
    if (NED10) { risovat10(ctx, M, q, tone, m); return; }
    grafik(ctx, M, 1, 2, G1Y0, G1Y1, 2.2, function (y) { sub(ctx, GX0, y, '⅔⟨ε', 'пост', '⟩ каждой стороны и общее пунктиром', 17, m, 'left'); },
           q.fixed ? null : q.kTfinal, ink, mut);
    grafik(ctx, M, 3, 4, G2Y0, G2Y1, 2.6, function (y) { C.label(ctx, GX0, y, '√⟨v²⟩ каждой стороны', 17, m, 'left'); }, null, ink, mut);
    C.label(ctx, GX1, G2Y1 + 22, 'время, последние ' + OKNO + ' единиц', 17, m, 'right');
    var Y = 384;
    C.readout(ctx, 190, Y, '', num(q.kT1, 2), 'rgb(' + CL + ')');
    podpisSub(ctx, 190, Y, '⅔⟨ε', 'пост', '⟩ СЛЕВА');
    C.label(ctx, 190, Y + 66, 'было 2', 17, m, 'right');
    C.readout(ctx, 390, Y, '', num(q.kT2, 2), 'rgb(' + CT + ')');
    podpisSub(ctx, 390, Y, '⅔⟨ε', 'пост', '⟩ СПРАВА');
    C.label(ctx, 390, Y + 66, 'было 0,5', 17, m, 'right');
    C.readout(ctx, 590, Y, 'ОБЩЕЕ', q.fixed ? '—' : num(q.kTfinal, 3), 'rgb(' + ink + ')');
    C.label(ctx, 590, Y + 66, q.fixed ? 'обмена нет' : 'E/(1,5N + 1)', 17, m, 'right');
    C.readout(ctx, 790, Y, 'ОТНОШЕНИЕ √⟨v²⟩', num(q.ratio, 2), 'rgb(' + ink + ')');
    C.label(ctx, 790, Y + 66, '√10 = 3,16', 17, m, 'right');
    C.readout(ctx, 990, Y, 'ВРЕМЯ', num(q.t, 0), 'rgb(' + ink + ')');
    C.label(ctx, 990, Y + 66, q.tau != null ? 'разность в e раз: ' + num(q.tau, 0) : 'единиц модели', 17, m, 'right');
    ctx.textAlign = 'center';
  }

  var ref = C.useStage(W, HGT, step, draw);

  /* Для автопроверки: __demoSet({ plateMass, fixed, seed }) пересоздаёт
     опыт; __demoModel — модель и счёт показаний. */
  window.__demoSet = function (o) {
    o = o || {};
    var p = {};
    if (o.plateMass != null) p.plateMass = o.plateMass;
    if (o.fixed != null) p.fixed = !!o.fixed;
    if (o.seed != null) p.seed = o.seed;
    if (NED12) p.start = o.start || 'odna';   /* 'raznye' — старт описи 2 и 0,5; без start вызов возвращает общий старт */
    zanovo(p);
    return pokaz;
  };
  window.__demoModel = { G: G, get M() { return S.M; }, novyj: novyj, vyborka: vyborka, sostoyanie: sostoyanie };

  function dvigatM(v) {
    var mm = Math.round(Math.max(M_MIN, Math.min(M_MAX, v)));
    if (mm === S.p.plateMass) return;
    zanovo({ plateMass: mm });
  }

  function slova() {
    var q = pokaz, A = function (x) { return '<span class="accent">' + x + '</span>'; };
    var eps = '⅔⟨ε<sub>пост</sub>⟩';
    if (NED12) return slova12(q, A);
    if (NED10) return slova10(q, A);
    if (q.fixed)
      return 'Пластина закреплена: молекулы отскакивают от неё, как от стенки, и энергия с одной стороны на другую не переходит. ' +
        eps + ' слева ' + A(num(q.kT1, 2)) + ', справа ' + A(num(q.kT2, 2)) + ', как на старте. Такая стенка не даёт теплового контакта.';
    var txt = 'Слева 300 лёгких молекул, горячих, справа 300 вдесятеро тяжелее, холодных, как гелий и аргон. Пластина молекул не пропускает, а энергию передаёт: молекулы бьют в неё с двух сторон, и она качается на пружине. ';
    var blizko = Math.abs(q.kT1 - q.kT2) < 0.12;
    if (!blizko)
      txt += 'Сейчас ' + eps + ' слева ' + A(num(q.kT1, 2)) + ', справа ' + A(num(q.kT2, 2)) + ' (было 2 и 0,5); обе идут к ' + num(q.kTfinal, 2) +
        ', это значение даёт сохранение энергии, если на пластину тоже приходится своя доля. Скорости при этом не выравниваются: √⟨v²⟩ лёгких сейчас больше в ' + A(num(q.ratio, 2)) + ' раза.';
    else
      txt += 'Средние энергии сравнялись: ' + eps + ' слева ' + A(num(q.kT1, 2)) + ', справа ' + A(num(q.kT2, 2)) + ', и дальше только дрожат около ' + num(q.kTfinal, 2) +
        ' на несколько процентов, как и положено трёмстам молекулам. А скорости разные: √⟨v²⟩ лёгких больше в ' + A(num(q.ratio, 2)) +
        ' раза, при равных средних энергиях это √10 = 3,16. При тепловом контакте выравнивается средняя энергия поступательного движения молекулы, а скорость нет; у шаров демки другой энергии и нет.';
    if (q.plateMass >= 100) txt += ' Пластина тяжёлая и качается медленно, поэтому энергия переходит дольше: время выравнивания задаёт стенка.';
    return txt;
  }

  /* Двенадцатая неделя: подпись о равнораспределении. Энергия пружины
     идёт только фразой (опись, карточка 5, «Риск»). */
  function slova12(q, A) {
    if (q.fixed)
      return 'Пластина закреплена: она не движется и энергией с газом не обменивается, поэтому кинетической энергии у неё нет.';
    var gazy = 'Слева 300 молекул массы 1, справа 300 массы 10, между ними пластина массы ' + q.plateMass + ' на пружине. ';
    if (q.oknoN < NPOKAZ) {
      if (q.start === 'raznye')
        return gazy + 'Стороны начинают при ' + eps12 + ' 2 и 0,5; средние пластины демка копит с t = 50, когда газы уже сравнялись.';
      return gazy + 'Температура у сторон одна, ' + eps12 + ' = ' + num(q.kTstart[0], 0) + '. Пластина стоит, и удары молекул за доли единицы времени её раскачивают.';
    }
    /* разброс среднего между зёрнами (шапка): у массы 20 σ 0,052; 0,034;
       0,024; 0,017 за 10, 20, 40, 75 единиц (тридцать зёрен); у массы 200
       за 20 единиц 0,10, за 300 0,025 при размахе 0,48–0,55 (шесть зёрен) */
    var drozh = q.plateMass >= 100 && q.oknoDlina < 150
      ? ' Тяжёлая пластина качается медленно, и среднее копится дольше: за первые десятки единиц оно уходит от 0,5 на 0,1, к трёмстам сходится до 0,05.'
      : q.oknoDlina < 75 ? ' Окно пока короткое, и среднее дрожит на несколько сотых.' : '';
    return gazy + 'Средняя кинетическая энергия пластины за ' + num(q.oknoDlina, 0) + ' ' + C.plural(Math.round(q.oknoDlina), 'единицу', 'единицы', 'единиц') + ' времени ⟨½MU²⟩ = ' + A(num(q.plateEkAvgKT, 2) + ' kT') + '.' + drozh +
      ' На движение пластины вдоль x, одно квадратичное слагаемое энергии, в равновесии приходится kT/2, как на проекцию скорости молекулы. ' +
      'От массы зависит скорость: лёгкие молекулы движутся вдоль x быстрее пластины в ' + A(num(q.ratioU, 2)) + ' раза, при равных энергиях это √' + q.plateMass + ' = ' + num(q.ratioUTheory, 2) + '. ' +
      'Энергию пружины табло не показывает: газы давят на пластину и добавляют к пружине свою жёсткость, поэтому средняя ½Kξ² меньше kT/2.';
  }
  var eps12 = '⅔⟨ε<sub>пост</sub>⟩';

  /* Десятая неделя: подпись об энтропии. Порог «сумма ещё растёт» есть
     недобор больше 5 k: в равновесии он держится около 0,4–0,8 k. */
  function slova10(q, A) {
    if (q.fixed)
      return 'Пластина закреплена, и энергия с одной стороны на другую не переходит. Сумма энтропий стоит на ' + A(num(q.SsumSm, 1)) +
        ' k, хотя при той же энергии газов она могла бы дойти до ' + num(q.SsumMax, 1) + ' k: без теплового контакта роста нет.';
    var vyr = q.tau != null ? 'разность температур упала в e раз за ' + num(q.tau, 0) + ' единиц'
      : q.plateMass >= 100 ? 'температуры через тяжёлую пластину сходятся за десятки и сотни единиц'
      : 'разность температур падает в e раз за 10–20 единиц';
    var txt = 'Энтропию каждой стороны демка считает по её энергии и объёму, как у идеального газа. Так можно, потому что каждая сторона внутри всё время равновесна: молекула пробегает между ударами ' +
      num(q.tauFree1, 2) + ' и ' + num(q.tauFree2, 2) + ' единицы времени, а ' + vyr + '. ';
    if (q.deficitSm > 5)
      txt += 'Горячая сторона отдала ' + A(num(q.EoutSm, 0)) + ' единиц энергии, и ' +
        (q.S1 < 0 ? 'её энтропия упала на ' + A(num(-q.S1, 0)) + ' k.' : 'её энтропия пока не упала, ' + A(num(q.S1, 0)) + ' k: сторону расширила пластина.') +
        ' Холодная получила почти столько же, а её энтропия выросла на ' + A(num(q.S2, 0)) +
        ' k: при низкой температуре та же энергия даёт больше энтропии. Сумма выросла на ' + A(num(q.SsumSm, 0)) + ' k.';
    else
      txt += 'Сумма выросла на ' + A(num(q.SsumSm, 1)) + ' k, по ' + num(q.perMol, 3) + ' k на молекулу, и встала у наибольшего значения, которое допускает энергия двух газов: сохранение энергии с долей пластины даёт ' +
        num(q.SsumExpect, 1) + ' k. Дальше сумма только дрожит на несколько k, и половина шагов идёт с убылью: у шестисот молекул закон роста держится в среднем. Колебания суммы остаются в несколько k при любом числе молекул, а рост пропорционален их числу: у моля он был бы около 2·10<sup>23</sup> k. ' +
        'Каждая сторона всё время была равновесна, а процесс необратим: тепло само к горячей стороне не вернётся.';
    if (q.t < 8) txt += ' В начале давления сторон 600 и 150, разность сдвигает пластину к холодной стороне, и объём сторон меняется: он тоже входит в энтропию.';
    return txt;
  }

  return html`
    <div class="demo">
      <div class="controls">
        ${NED12 ? null : html`<${C.Group} label="Стенка:">
          <${C.Btn} active=${!S.p.fixed} onClick=${function () { zanovo({ fixed: false }); }}>на пружине<//>
          <${C.Btn} active=${S.p.fixed} onClick=${function () { zanovo({ fixed: true }); }}>неподвижна<//>
        <//>`}
        <${C.Slider} label="Масса пластины:" log=${true} min=${M_MIN} max=${M_MAX} value=${S.p.plateMass}
                     onChange=${dvigatM} display=${String(S.p.plateMass)} />
        <${C.Group}>
          <${C.Btn} action=${true} onClick=${function () { zanovo(); }}>Заново<//>
        <//>
      </div>
      <canvas class="stage" ref=${ref}></canvas>
      <${C.Status} html=${slova()} />
    </div>`;
}

C.mount(DvaGaza);
</script>
</body>
</html>
