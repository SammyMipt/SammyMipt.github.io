   плотность 0,997; 0,987; 0,95; 0,94 от N/V. Ударов там за τ 0,98; 0,98;
   0,95; 0,89, как и ждём по n·χ середины, пробег в толще длиннее λ по N/V,
   и D в единицах λ⟨v⟩ от этого завышен. С пробегом по ударам меченых
   (D, умноженный на их удары за τ) счёт выше 3π/16 на 8; 9; 12; 14 %;
   этот остаток растёт с долей объёма и отдельным счётом не разобран.
   Разброс D одного выпуска ± 0,12,
   после двенадцати ± 0,034. Отрицательный контроль: D = ⅓λ⟨v⟩ и D = λ⟨v⟩,
   ⟨cos⟩ = 0, ⟨r²⟩ при τ/6 на прямой 6Dt и свой счёт с неверной развёрткой
   (расхождение 0,75) проверка отвергает. Режимы девятой, двенадцатой и
   тяжёлой молекулы не изменились: __demoState, подпись, рейка, заголовок
   и ссылка возврата на тех же зёрнах совпали с файлом HEAD на шестнадцати
   адресах, включая ?rezhim=oblako, ?nedelya=12&rezhim=oblako и
   ?nedelya=13&rezhim=Oblako. */

var N_O = 2000;
var DOLI_O = [0.02, 0.05, 0.1, 0.2];
var R0_O = 0.19;            /* радиус области выпуска вокруг середины ящика */
var SHAG_O = 1 / 6;         /* шаг выборки в долях τ */
var NLAG_O = 120;           /* окно выпуска 20 τ */
var LAG0_O = 45;            /* прямая по точкам от 7,5 τ */
var LAGMIN_O = 72;          /* прямая считается, когда накоплено 12 τ */
var NLUPA_O = 18;           /* лупа: первые 3 τ */
var SK_O = 0.8, SKB_O = 8;  /* τ за секунду экрана: обычно и быстро */
var SLED_O = 40;            /* в следе последние 40 ударов */

/* Развёрнутая координата обратно в ящик: зеркальные образы ребра 1. */
function svernutO(u) { var f = u % 2; if (f < 0) f += 2; return f <= 1 ? f : 2 - f; }

/* Запись о прослеживаемой молекуле: развёрнутая вершина ul в момент tl,
   развёрнутая скорость w, знаки развёртки sg, сырая скорость v для
   узнавания удара, старт u0. */
function zapisatO(g, p, j) {
  var x = [p[3 * j], p[3 * j + 1], p[3 * j + 2]], v = [g.vx[j], g.vy[j], g.vz[j]];
  return { j: j, sg: [1, 1, 1], u0: x.slice(), ul: x.slice(), tl: g.t, w: v.slice(), v: v.slice(),
           ud: 0, put: 0, pervyj: true };
}
function gdeO(r, t) { var s = t - r.tl; return [r.ul[0] + r.w[0] * s, r.ul[1] + r.w[1] * s, r.ul[2] + r.w[2] * s]; }
function modO(a) { return Math.sqrt(a[0] * a[0] + a[1] * a[1] + a[2] * a[2]); }

/* Удар о соседа узнаётся по смене сырой скорости: стенка свою смену
   сообщает раньше, через onHit. Вершина пролёта считается по прямой
   развёрнутого пролёта, длина пролёта |w|·Δt. */
function udarOdnoj(M, r, t, metka) {
  var g = M.g, j = r.j;
  if (g.vx[j] === r.v[0] && g.vy[j] === r.v[1] && g.vz[j] === r.v[2]) return;
  var s = t - r.tl, a = r.w, sp = modO(a), l = sp * s;
  r.ul = [r.ul[0] + a[0] * s, r.ul[1] + a[1] * s, r.ul[2] + a[2] * s]; r.tl = t;
  r.v = [g.vx[j], g.vy[j], g.vz[j]];
  var b = [r.sg[0] * r.v[0], r.sg[1] * r.v[1], r.sg[2] * r.v[2]], sb = modO(b);
  var cs = (a[0] * b[0] + a[1] * b[1] + a[2] * b[2]) / (sp * sb);
  r.w = b; r.ud += 1; r.put += l;
  if (metka) {
    M.sCos += cs; M.nCos += 1;
    if (!r.pervyj) { M.sL += l; M.sL2 += l * l; M.nPr += 1; }
  } else {
    M.sled.push([svernutO(r.ul[0]), svernutO(r.ul[1]), 1]);
    var n = 0, i;
    for (i = M.sled.length - 1; i >= 0; i--) if (M.sled[i][2] && ++n > SLED_O) break;
    if (i > 0) M.sled.splice(0, i);
  }
  r.pervyj = false;
}
function udarO(M) {
  var t = M.g.t, sp = M.tek ? M.tek.spisok : [], k;
  for (k = 0; k < sp.length; k++) udarOdnoj(M, sp[k], t, true);
  if (M.tr) udarOdnoj(M, M.tr, t, false);
}
function stenkaOdnoj(g, r, w) {
  var j = r.j;
  r.sg[w >> 1] = -r.sg[w >> 1];
  r.v = [g.vx[j], g.vy[j], g.vz[j]];
}
function stenkaO(M, w, j) {
  if (M.idx && M.idx[j] >= 0) stenkaOdnoj(M.g, M.tek.spisok[M.idx[j]], w);
  if (M.tr && j === M.tr.j) {
    stenkaOdnoj(M.g, M.tr, w);
    var u = gdeO(M.tr, M.g.t);
    M.sled.push([svernutO(u[0]), svernutO(u[1]), 0]);
  }
}

function novyjO(p) {
  var M = { eta: p.eta, seed: p.seed, buf: new Float64Array(3 * N_O), idx: null, tek: null, tr: null,
            sum: new Float64Array(NLAG_O + 1), cnt: new Float64Array(NLAG_O + 1), Dk: [], nVyp: 0,
            sCos: 0, nCos: 0, sL: 0, sL2: 0, nPr: 0, putVse: 0, udVse: 0, vremyaVse: 0,
            konR2: 0, konUd: 0, konN: 0, sled: [] };
  var nc = 0;
  M.g = G.create({ N: N_O, eta: p.eta, seed: p.seed, onHit: function (w, j) { stenkaO(M, w, j); } });
  /* Удары шаров движок считает в g.nColl после того, как сменил скорости
     пары; свойство-счётчик здесь отдаёт то же число и при каждом ударе
     зовёт udarO. Движок, датчик случайных чисел и порядок событий те же. */
  Object.defineProperty(M.g, 'nColl', { configurable: true, enumerable: true,
    get: function () { return nc; }, set: function (v) { nc = v; udarO(M); } });
  var g = M.g;
  M.d = g.d;
  M.kT = 2 * g.energy() / (3 * N_O);
  M.vsr = Math.sqrt(8 * M.kT / Math.PI);
  M.lam = 1 / (Math.SQRT2 * N_O * Math.PI * g.d * g.d * G.chi(p.eta));
  M.tau = M.lam / M.vsr;
  M.h = SHAG_O * M.tau;
  /* след: молекула, ближайшая к середине ящика */
  var q = g.pos(M.buf), best = 0, bd = Infinity, i;
  for (i = 0; i < N_O; i++) {
    var dx = q[3 * i] - 0.5, dy = q[3 * i + 1] - 0.5, dz = q[3 * i + 2] - 0.5, dd = dx * dx + dy * dy + dz * dz;
    if (dd < bd) { bd = dd; best = i; }
  }
  M.tr = zapisatO(g, q, best); M.tr.t0 = g.t;
  M.sled.push([q[3 * best], q[3 * best + 1], 0]);
  vypustitO(M);
  return M;
}

/* Выпуск: метятся молекулы в шаре радиусом R0_O у середины ящика. Выпуск
   копит свои суммы отдельно; в общую кривую он входит, только когда дошёл
   до конца окна, так что на каждом сдвиге общая кривая усреднена по одним
   и тем же выпускам. Выпуск, прерванный кнопкой, в общую кривую не входит. */
function vypustitO(M) {
  var g = M.g, p = g.pos(M.buf), sp = [], i;
  M.idx = new Int32Array(N_O).fill(-1);
  for (i = 0; i < N_O; i++) {
    var dx = p[3 * i] - 0.5, dy = p[3 * i + 1] - 0.5, dz = p[3 * i + 2] - 0.5;
    if (dx * dx + dy * dy + dz * dz < R0_O * R0_O) { M.idx[i] = sp.length; sp.push(zapisatO(g, p, i)); }
  }
  M.tek = { spisok: sp, t0: g.t, shag: 0, s: new Float64Array(NLAG_O + 1), sum: new Float64Array(NLAG_O + 1) };
  zapisO(M);
}

/* Снимок шага: r² каждой меченой от её старта в развёртке, в суммы выпуска. */
function zapisO(M) {
  var T = M.tek, L = T.shag, sp = T.spisok, t = M.g.t, s = 0, k;
  for (k = 0; k < sp.length; k++) {
    var u = gdeO(sp[k], t), a = u[0] - sp[k].u0[0], b = u[1] - sp[k].u0[1], c = u[2] - sp[k].u0[2];
    s += a * a + b * b + c * c;
  }
  T.s[L] = s; T.sum[L] = sp.length ? s / sp.length : 0;
}

/* Конец выпуска: путь и удары меченых в общий счёт; законченный выпуск
   отдаёт свои суммы в общую кривую и свой наклон в разброс D. */
function zakonchitO(M, polnyj) {
  var T = M.tek, sp = T.spisok, t = M.g.t, k, L;
  if (polnyj) for (L = 0; L <= NLAG_O; L++) { M.sum[L] += T.s[L]; M.cnt[L] += sp.length; }
  for (k = 0; k < sp.length; k++) {
    var r = sp[k];
    M.putVse += r.put + modO(r.w) * (t - r.tl); M.udVse += r.ud;
    if (polnyj) {
      var u = gdeO(r, t), a = u[0] - r.u0[0], b = u[1] - r.u0[1], c = u[2] - r.u0[2];
      M.konR2 += a * a + b * b + c * c; M.konUd += r.ud; M.konN += 1;
    }
  }
  M.vremyaVse += sp.length * (t - T.t0);
  if (polnyj && sp.length) { M.Dk.push(naklonO(T.sum, M.h, NLAG_O)); M.nVyp += 1; }
}

function naklonO(y, h, nL) {
  var sx = 0, sy = 0, sxx = 0, sxy = 0, n = 0, L;
  for (L = LAG0_O; L <= nL; L++) { var x = L * h; sx += x; sy += y[L]; sxx += x * x; sxy += x * y[L]; n++; }
  var a = (n * sxy - sx * sy) / (n * sxx - sx * sx);
  return { D: a / 6, a: a, b: (sy - a * sx) / n };
}

function tikO(M) {
  M.g.advance(M.h);
  M.tek.shag += 1;
  zapisO(M);
  if (M.tek.shag >= NLAG_O) { zakonchitO(M, true); vypustitO(M); }
}

function pokazaniyaO(M) {
  var g = M.g, h = M.h, lam = M.lam, vl = lam * M.vsr, L, msd = [], msdTek = [], T0 = M.tek;
  /* Общая кривая: законченные выпуски. Пока их нет, общей кривой служит
     идущий выпуск, на тех сдвигах, до которых он дошёл. */
  for (L = 0; L <= NLAG_O; L++) {
    var tk = L <= T0.shag && T0.spisok.length ? T0.sum[L] : null;
    msdTek.push(tk);
    msd.push(M.nVyp ? (M.cnt[L] ? M.sum[L] / M.cnt[L] : null) : tk);
  }
  var nL = M.nVyp ? NLAG_O : (T0.spisok.length ? T0.shag : 0);
  var fit = null, Dslope = null, DslopeErr = null;
  if (nL >= LAGMIN_O) { fit = naklonO(msd, h, nL); Dslope = fit.D; }
  if (M.Dk.length >= 3) {
    var s = 0, s2 = 0, n = M.Dk.length;
    M.Dk.forEach(function (q) { s += q.D; s2 += q.D * q.D; });
    DslopeErr = Math.sqrt(Math.max(0, (s2 - s * s / n) / (n - 1)) / n);
  }
  var T = M.tek, sp = T.spisok, tr = M.tr, t = g.t, k;
  /* путь и удары меченых вместе с нынешним выпуском */
  var put = M.putVse, ud = M.udVse, vr = M.vremyaVse + sp.length * (t - T.t0);
  for (k = 0; k < sp.length; k++) { put += sp[k].put + modO(sp[k].w) * (t - sp[k].tl); ud += sp[k].ud; }
  var ut = gdeO(tr, t), Rt = modO([ut[0] - tr.u0[0], ut[1] - tr.u0[1], ut[2] - tr.u0[2]]);
  var Lt = tr.put + modO(tr.w) * (t - tr.tl);
  var l1 = M.nPr ? M.sL / M.nPr : null, l2 = M.nPr ? M.sL2 / M.nPr : null;
  return {
    nedelya: 13, rezhim: 'oblako', N: N_O, eta: M.eta, d: M.d, seed: M.seed, kT: M.kT, chi: G.chi(M.eta),
    t: t, h: h, lambda: lam, tau: M.tau, vsr: M.vsr, R0: R0_O,
    Dmodel: vl / 3, Dce: 3 * Math.PI / 16 * vl,
    K: sp.length, lag: T.shag, nLag: nL, nVyp: M.nVyp, msd: msd, msdTek: msdTek, cnt: Array.from(M.cnt),
    ball1: msd[1] != null ? msd[1] / (3 * M.kT * h * h) : null,
    fitA: fit ? fit.a : null, fitB: fit ? fit.b : null,
    Dslope: Dslope, Dl: Dslope != null ? Dslope / vl : null,
    DslopeErr: DslopeErr, DlErr: DslopeErr != null ? DslopeErr / vl : null, Dk: M.Dk.map(function (q) { return q.D; }),
    cos: M.nCos ? M.sCos / M.nCos : null, nCos: M.nCos,
    flights: M.nPr, l1: l1 != null ? l1 / lam : null, l2rel: l2 != null ? l2 / (l1 * l1) : null,
    lPut: ud ? put / ud / lam : null, udNaTau: vr ? ud / (vr / M.tau) : null,
    R2NL2: M.konN && l2 ? (M.konR2 / M.konN) / ((M.konUd / M.konN) * l2) : null,
    R2Nl: M.konN ? (M.konR2 / M.konN) / ((M.konUd / M.konN) * lam * lam) : null,
    trJ: tr.j, trN: tr.ud, trL: Lt / lam, trR: Rt / lam, trT: (t - tr.t0) / M.tau,
    trPr: tr.ud ? Lt / tr.ud / lam : null, trLR: Rt > 0 ? Lt / Rt : null,
    drift: g.drift(), nColl: g.nColl, nEv: g.nEv
  };
}

var TX0_O = 400, TX1_O = 765, TY0_O = 62, TY1_O = 318;   /* график */
/* лупа первых 3 τ: своя панель справа от графика, главная кривая в неё не заходит */
var LX0_O = 805, LX1_O = 975, LY0_O = 92, LY1_O = 318;
var CO_O = '77,182,198', CT_O = '224,138,82', CL_O = '120,178,96';

function Oblako13() {
  var box = useRef(null);
  if (!box.current) {
    var p0 = { eta: 0.1, seed: (Math.random() * 4294967296) >>> 0 };
    box.current = { p: p0, M: novyjO(p0), nakop: 0, bystro: false };
  }
  var S = box.current;
  var pair = useState({ n: 0 });
  var setUi = pair[1];
  var ui = useRef({ last: 0 });
  var pokazO = useRef({}).current;
  window.__demoState = pokazO;

  function snyat() {
    var q = pokazaniyaO(S.M);
    for (var k in pokazO) delete pokazO[k];
    Object.assign(pokazO, q);
  }
  if (pokazO.N == null) snyat();
  function obnovit() { snyat(); setUi(function (u) { return { n: u.n + 1 }; }); }

  function zanovo(o) {
    Object.assign(S.p, o || {});
    if (!o || o.seed == null) S.p.seed = (Math.random() * 4294967296) >>> 0;
    S.M = novyjO(S.p); S.nakop = 0;
    obnovit();
  }

  function step(dt) {
    var M = S.M, k = 0;
    S.nakop += dt * (S.bystro ? SKB_O : SK_O) * M.tau;
    while (S.nakop >= M.h && k < 20) { tikO(M); S.nakop -= M.h; k++; }
    if (k === 20) S.nakop = 0;
    snyat();
    ui.current.last += dt;
    if (ui.current.last > 0.5) { ui.current.last = 0; setUi(function (u) { return { n: u.n + 1 }; }); }
  }

  /* ── рисунок ── */

  function yashchik(ctx, M, q, ink, mut) {
    var g = M.g, rB = Math.max(1.6, g.d / 2 * B12), p = g.pos(M.buf), i, L;
    var wx0 = BX12 - g.d / 2 * B12, wy0 = BY12 - g.d / 2 * B12, wl = B12 + g.d * B12;
    ctx.strokeStyle = 'rgba(' + ink + ',.75)'; ctx.lineWidth = 2;
    ctx.strokeRect(wx0, wy0, wl, wl);
    /* немеченые серым туманом по шести слоям глубины */
    for (L = 0; L < 6; L++) {
      ctx.fillStyle = 'rgba(' + mut + ',' + (0.07 + 0.035 * L).toFixed(3) + ')';
      ctx.beginPath();
      for (i = 0; i < N_O; i++) {
        if (M.idx[i] >= 0 || i === M.tr.j) continue;
        if (Math.min(5, Math.floor(p[3 * i + 2] * 6)) !== L) continue;
        var X = BX12 + p[3 * i] * B12, Y = BY12 + (1 - p[3 * i + 1]) * B12;
        ctx.moveTo(X + rB, Y); ctx.arc(X, Y, rB, 0, 2 * Math.PI);
      }
      ctx.fill();
    }
    /* где выпущено облако */
    ctx.save(); ctx.setLineDash([5, 5]); ctx.strokeStyle = 'rgba(' + CO_O + ',.8)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(BX12 + 0.5 * B12, BY12 + 0.5 * B12, R0_O * B12, 0, 2 * Math.PI); ctx.stroke(); ctx.restore();
    /* меченые */
    ctx.fillStyle = 'rgb(' + CO_O + ')'; ctx.beginPath();
    M.tek.spisok.forEach(function (r) {
      var X = BX12 + p[3 * r.j] * B12, Y = BY12 + (1 - p[3 * r.j + 1]) * B12;
      ctx.moveTo(X + rB + 0.5, Y); ctx.arc(X, Y, rB + 0.5, 0, 2 * Math.PI);
    });
    ctx.fill();
    /* след: прямые пролёты, точки на ударах о соседей */
    var sl = M.sled, j = M.tr.j, Xt = BX12 + p[3 * j] * B12, Yt = BY12 + (1 - p[3 * j + 1]) * B12;
    ctx.strokeStyle = 'rgba(' + CT_O + ',.9)'; ctx.lineWidth = 2; ctx.beginPath();
    for (i = 0; i < sl.length; i++) {
      var Xs = BX12 + sl[i][0] * B12, Ys = BY12 + (1 - sl[i][1]) * B12;
      if (i) ctx.lineTo(Xs, Ys); else ctx.moveTo(Xs, Ys);
    }
    ctx.lineTo(Xt, Yt); ctx.stroke();
    ctx.fillStyle = 'rgb(' + CT_O + ')';
    for (i = 0; i < sl.length; i++) {
      if (!sl[i][2]) continue;
      ctx.beginPath(); ctx.arc(BX12 + sl[i][0] * B12, BY12 + (1 - sl[i][1]) * B12, 3, 0, 2 * Math.PI); ctx.fill();
    }
    ctx.beginPath(); ctx.arc(Xt, Yt, rB + 1.5, 0, 2 * Math.PI); ctx.fill();
    ctx.strokeStyle = 'rgba(' + ink + ',.9)'; ctx.lineWidth = 1.2; ctx.stroke();
    C.label(ctx, BX12 + B12 / 2, 30, N_O + ' молекул, меченых ' + q.K + ', вид сбоку', 17, 'rgba(' + mut + ',.95)');
  }

  function grafik(ctx, M, q, ink, mut) {
    var TL = NLAG_O * SHAG_O, l2 = q.lambda * q.lambda, ball = 3 * q.kT * q.tau * q.tau / l2, L, X, Y, v;
    var ymax = 6 * 0.62 * TL * 0.95;
    for (L = 0; L <= q.nLag; L++) if (q.msd[L] != null) ymax = Math.max(ymax, q.msd[L] / l2 * 1.08);
    function px(x) { return TX0_O + x / TL * (TX1_O - TX0_O); }
    function py(y) { return TY1_O - Math.min(1.04, y / ymax) * (TY1_O - TY0_O); }
    C.label(ctx, TX0_O, 32, 'средний квадрат смещения меченых ⟨r²⟩, в λ²', 17, 'rgba(' + mut + ',.95)', 'left');
    ctx.strokeStyle = 'rgba(' + ink + ',.5)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(TX0_O, TY0_O); ctx.lineTo(TX0_O, TY1_O); ctx.lineTo(TX1_O, TY1_O); ctx.stroke();
    for (v = 0; v < TL; v += 5) {
      X = px(v); ctx.beginPath(); ctx.moveTo(X, TY1_O); ctx.lineTo(X, TY1_O + 5); ctx.stroke();
      C.label(ctx, X, TY1_O + 24, String(v), 17, 'rgba(' + mut + ',.95)');
    }
    C.label(ctx, TX1_O, TY1_O + 24, 't, в τ', 17, 'rgba(' + mut + ',.95)', 'right');
    var sty = shagOsi13(ymax, 3);
    for (v = sty; v < ymax; v += sty) {
      Y = py(v);
      ctx.strokeStyle = 'rgba(' + ink + ',.12)'; ctx.beginPath(); ctx.moveTo(TX0_O, Y); ctx.lineTo(TX1_O, Y); ctx.stroke();

    }
    ctx.save(); ctx.beginPath(); ctx.rect(TX0_O, TY0_O - 8, TX1_O - TX0_O, TY1_O - TY0_O + 8); ctx.clip();

    ctx.setLineDash([7, 5]); ctx.strokeStyle = 'rgba(' + CT_O + ',.95)'; ctx.lineWidth = 2; ctx.beginPath();
    for (L = 0; L <= 100; L++) { var x = 6 * L / 100; X = px(x); Y = py(ball * x * x); if (L) ctx.lineTo(X, Y); else ctx.moveTo(X, Y); }

      ctx.moveTo(px(t0 / q.tau), py((q.fitA * t0 + q.fitB) / l2));
      ctx.lineTo(px(TL), py((q.fitA * TL * q.tau + q.fitB) / l2)); ctx.stroke();
    }

    if (q.nVyp) {
      ctx.fillStyle = 'rgba(' + CO_O + ',.35)';
      for (L = 2; L <= q.lag; L += 2) {
        if (q.msdTek[L] == null) continue;
        ctx.beginPath(); ctx.arc(px(L * SHAG_O), py(q.msdTek[L] / l2), 3, 0, 2 * Math.PI); ctx.fill();
      }
    }
    ctx.restore();
    ctx.fillStyle = 'rgb(' + CO_O + ')';
    for (L = 2; L <= q.nLag; L += 2) {
      if (q.msd[L] == null) continue;
      ctx.beginPath(); ctx.arc(px(L * SHAG_O), py(q.msd[L] / l2), 3.5, 0, 2 * Math.PI); ctx.fill();

    ctx.beginPath(); ctx.moveTo(lx, ly + 18); ctx.lineTo(lx + 24, ly + 18); ctx.stroke(); ctx.restore();
    C.label(ctx, lx + 30, ly + 24, 'свободный пролёт 3(kT/m)t²', 17, 'rgb(' + CT_O + ')', 'left');
    ctx.save(); ctx.lineWidth = 2.5; ctx.strokeStyle = 'rgb(' + CL_O + ')';
    ctx.beginPath(); ctx.moveTo(lx, ly + 42); ctx.lineTo(lx + 24, ly + 42); ctx.stroke(); ctx.restore();
    C.label(ctx, lx + 30, ly + 48, 'прямая с наклоном 6D', 17, 'rgb(' + CL_O + ')', 'left');
    if (q.nVyp) {
      ctx.fillStyle = 'rgba(' + CO_O + ',.35)'; ctx.beginPath(); ctx.arc(lx + 12, ly + 66, 4, 0, 2 * Math.PI); ctx.fill();
      C.label(ctx, lx + 30, ly + 72, 'идущий выпуск', 17, 'rgba(' + mut + ',.95)', 'left');

    if (q.fitA == null) C.label(ctx, TX1_O - 8, TY1_O - 20, 'прямая появится к 12 τ', 17, 'rgba(' + mut + ',.95)', 'right');
    lupa(ctx, q, ink, mut, ball, l2);
  }

  /* Лупа: первые 3 τ, где точки сходят с параболы свободного пролёта. */
  function lupa(ctx, q, ink, mut, ball, l2) {

  /* Для автопроверки: __demoSet({ eta, seed, bystro }) (eta или seed

var N_PR = 1600, K_PR = 50, M_PR = 1e10;
var DOLI_PR = [0.01, 0.02, 0.05, 0.1];
var KT_PR = [0.25, 0.5, 1, 2, 4];
var KOLCO_PR = 60000;       /* пробегов в кольце */
var PROGREV_PR = 8;         /* прогрев в τ при создании газа */
var SK_PR = 1, SKB_PR = 10; /* τ за секунду экрана: обычно и быстро */
var SKM_PR = 4;             /* множитель скорости, когда мишени стоят */
var SLED_PR = 12;           /* в следе последние 12 ударов */
var DH_PR = 0.2, NB_PR = 40;/* столбики гистограммы в λ, их число (до 8λ) */
var XL_PR = 5, XG_PR = 8;   /* предел оси l: линейно и в логарифме */
var YL_PR = 1.25, YG0_PR = -3, YG1_PR = 0.3;  /* ось w: линейно; lg w в логарифме */
var MIN_PRIZRAK_PR = 3000;  /* сколько пробегов нужно, чтобы гистограмма осталась пунктиром */

function udarPr(M, i) {
  var g = M.g, t = g.t;
  if (i === M.tr) tochkaPr(M, true);
  if (i >= M.K) return;
  var l = M.acc[i] + M.sp[i] * (t - M.ts[i]);
  if (M.zap) {
    M.ud += 1;
    if (M.seen[i]) { M.ring[M.rp] = l; M.rp = (M.rp + 1) % KOLCO_PR; M.nr += 1; }
  }
  M.seen[i] = 1; M.acc[i] = 0; M.ts[i] = t;
  M.sp[i] = Math.sqrt(g.vx[i] * g.vx[i] + g.vy[i] * g.vy[i] + g.vz[i] * g.vz[i]);
}

/* Точка следа: удар о соседа с точкой, о стенку излом без точки. */
function tochkaPr(M, dot) {
  var p = M.g.pos(M.buf), j = M.tr, n = 0, i;
  M.sled.push([p[3 * j], p[3 * j + 1], dot ? 1 : 0]);
  for (i = M.sled.length - 1; i >= 0; i--) if (M.sled[i][2] && ++n > SLED_PR) break;
  if (i > 0) M.sled.splice(0, i);
}

function novyjPr(p) {
  var st = !!p.stoyat, K = st ? K_PR : N_PR, i;
  var M = { eta: p.eta, kT: p.kT, stoyat: st, seed: p.seed, K: K, buf: new Float64Array(3 * N_PR),
            acc: new Float64Array(N_PR), sp: new Float64Array(N_PR), ts: new Float64Array(N_PR), seen: new Uint8Array(N_PR),
            ring: new Float64Array(KOLCO_PR), nr: 0, rp: 0, zap: false, ud: 0, t0: 0, sled: [], tr: -1 };
  var o = { N: N_PR, eta: p.eta, seed: p.seed, kT: p.kT,
            onHit: function (w, j) { if (j === M.tr) tochkaPr(M, false); },
            onPair: function (j, q) { udarPr(M, j); udarPr(M, q); } };
  if (st) o.m = function (k) { return k < K_PR ? 1 : M_PR; };
  M.g = G.create(o);
  var g = M.g;
  M.d = g.d; M.chi = G.chi(p.eta);
  M.lam = 1 / (Math.SQRT2 * N_PR * Math.PI * g.d * g.d * M.chi);
  M.tau1 = M.lam / Math.sqrt(8 / Math.PI);
  for (i = 0; i < N_PR; i++) M.sp[i] = Math.sqrt(g.vx[i] * g.vx[i] + g.vy[i] * g.vy[i] + g.vz[i] * g.vz[i]);
  /* след: летящая молекула, ближайшая к середине ящика */
  var q = g.pos(M.buf), bd = Infinity;
  for (i = 0; i < K; i++) {
    var dx = q[3 * i] - 0.5, dy = q[3 * i + 1] - 0.5, dz = q[3 * i + 2] - 0.5, dd = dx * dx + dy * dy + dz * dz;
    if (dd < bd) { bd = dd; M.tr = i; }
  }
  M.sled.push([q[3 * M.tr], q[3 * M.tr + 1], 0]);
  g.advance(PROGREV_PR * M.tau1);
  M.zap = true; M.t0 = g.t;
  return M;
}

/* Смена kT на ходу: шары приводятся к нынешнему моменту, скорости всех
   умножаются на √(kT/kT₀), события предсказываются заново. */
function kTPr(M, kT) {
  var g = M.g, f = Math.sqrt(kT / M.kT), t, i;
  g.setCollisions(true);
  t = g.t;
  for (i = 0; i < N_PR; i++) {
    M.acc[i] += M.sp[i] * (t - M.ts[i]); M.ts[i] = t;
    g.vx[i] *= f; g.vy[i] *= f; g.vz[i] *= f;
    M.sp[i] = Math.sqrt(g.vx[i] * g.vx[i] + g.vy[i] * g.vy[i] + g.vz[i] * g.vz[i]);
  }
  g.E0 *= f * f;
  g.setCollisions(true);
  M.kT = kT;
}

/* Счёт начинается заново: кольцо пусто, удары с нуля. */
function sbrosPr(M) { M.nr = 0; M.rp = 0; M.ud = 0; M.t0 = M.g.t; }

/* Числа по кольцу пробегов. */
function statsPr(M) {
  var n = Math.min(M.nr, KOLCO_PR), lam = M.lam, i, s = 0, s2 = 0;
  var hist = new Array(NB_PR).fill(0), za = 0;
  if (!n) return { n: 0, hist: hist, za: 0 };
  var a = Float64Array.from(M.ring.subarray(0, n));
  for (i = 0; i < n; i++) {
    s += a[i]; s2 += a[i] * a[i];
    var b = Math.floor(a[i] / lam / DH_PR);
    if (b < NB_PR) hist[b] += 1; else za += 1;
  }
  var mean = s / n;
  a.sort();
  var med = n % 2 ? a[(n - 1) / 2] : 0.5 * (a[n / 2 - 1] + a[n / 2]);
  var lo = 0, hi = n;                       /* первый индекс с l > mean */
  while (lo < hi) { var mid = (lo + hi) >> 1; if (a[mid] > mean) hi = mid; else lo = mid + 1; }
  for (i = 0; i < NB_PR; i++) hist[i] /= n * DH_PR;
  return { n: n, mean: mean, med: med, over: (n - lo) / n, r2: s2 / n / (2 * mean * mean), hist: hist, za: za / n };
}

function pokazaniyaPr(M, prizrak, prezhnij) {
  var g = M.g, st = statsPr(M), lam = M.lam, K = M.K, i, e = 0, vs = 0;
  for (i = 0; i < K; i++) {
    e += 0.5 * g.m[i] * (g.vx[i] * g.vx[i] + g.vy[i] * g.vy[i] + g.vz[i] * g.vz[i]);
    vs += Math.sqrt(g.vx[i] * g.vx[i] + g.vy[i] * g.vy[i] + g.vz[i] * g.vz[i]);
  }
  var kTg = 2 * e / (3 * K), vsr = M.stoyat ? vs / K : Math.sqrt(8 * kTg / Math.PI);
  var sig = Math.PI * M.d * M.d, n = N_PR;
  var nuTh = (M.stoyat ? 1 : Math.SQRT2) * n * sig * vsr * M.chi;
  var T = g.t - M.t0, nu = T > 0 ? M.ud / (K * T) : null;
  var meanL = st.n ? st.mean / lam : null;
  var ratio = M.stoyat && meanL != null && prezhnij && prezhnij.eta === M.eta ? meanL / prezhnij.meanL : null;
  return {
    nedelya: 13, rezhim: 'probegi', N: N_PR, K: K, eta: M.eta, d: M.d, chi: M.chi, seed: M.seed,
    kT: M.kT, kTgaz: kTg, stoyat: M.stoyat, t: g.t, tStat: T, tau1: M.tau1,
    lambda: lam, lambdaFix: Math.SQRT2 * lam, lambdaTheory: M.stoyat ? Math.SQRT2 * lam : lam,
    paths: st.n, pathsAll: M.nr, lambdaMean: st.n ? st.mean : null, meanL: meanL,
    meanTh: M.stoyat ? Math.SQRT2 : 1, meanRel: meanL != null ? meanL / (M.stoyat ? Math.SQRT2 : 1) : null,
    nu: nu, nuTheory: nuTh, nuRel: nu != null ? nu / nuTh : null, vsr: vsr,
    fracOverMean: st.n ? st.over : null, median: st.n ? st.med / st.mean : null, medianL: st.n ? st.med / lam : null,
    r2: st.n ? st.r2 : null, hist: st.hist, histBeyond: st.za, dh: DH_PR,
    ratio: ratio, prezhnij: prezhnij ? prezhnij.meanL : null,
    prizrak: prizrak ? { label: prizrak.label, hist: prizrak.hist, nu: prizrak.nu, kT: prizrak.kT, eta: prizrak.eta, stoyat: prizrak.stoyat } : null,
    trJ: M.tr, drift: g.drift(), nColl: g.nColl, nEv: g.nEv
  };
}

var TX0_PR = 400, TX1_PR = 975, TY0_PR = 62, TY1_PR = 318;

function chisloKT(v) { return String(v).replace('.', ','); }
/* удары за единицу времени: от 10 и выше целым числом */
function chisloNu(v) { return num(v, v >= 10 ? 0 : 1); }
function tysyachi(n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ' '); }

function Probegi13() {
  var box = useRef(null);
  if (!box.current) {
    var p0 = { eta: 0.05, kT: 1, stoyat: false, seed: (Math.random() * 4294967296) >>> 0 };
    box.current = { p: p0, M: novyjPr(p0), log: false, bystro: false, prizrak: null, prezhnij: null };
  }
  var S = box.current;
  var pair = useState({ n: 0 });
  var setUi = pair[1];
  var ui = useRef({ st: 0 });
  var pokazP = useRef({}).current;
  window.__demoState = pokazP;

  function snyat() {
    var q = pokazaniyaPr(S.M, S.prizrak, S.prezhnij);
    for (var k in pokazP) delete pokazP[k];
    Object.assign(pokazP, q);
  }
  if (pokazP.N == null) snyat();
  function obnovit() { snyat(); setUi(function (u) { return { n: u.n + 1 }; }); }

  /* Нынешняя гистограмма уходит пунктиром, если в ней достаточно пробегов.
     Если не набралось, а пунктир снят при движущихся мишенях той же доли
     (например, при другой kT за секунду до кнопки «мишени стоят»), он и
     есть гистограмма движущихся мишеней: при той же концентрации форма от
     температуры не зависит, и подпись меняется на «мишени движутся». */
  function zapomnit(label) {
    var q = pokazaniyaPr(S.M, null, null);
    if (q.paths >= MIN_PRIZRAK_PR) S.prizrak = { label: label, hist: q.hist.slice(), nu: q.nu, kT: S.M.kT, eta: S.M.eta, stoyat: S.M.stoyat };
    else if (label === 'мишени движутся' && !S.M.stoyat && S.prizrak && !S.prizrak.stoyat && S.prizrak.eta === S.M.eta) S.prizrak.label = label;
    if (!S.M.stoyat && q.paths >= MIN_PRIZRAK_PR) S.prezhnij = { meanL: q.meanL, eta: S.M.eta };
  }
  function zanovo(o, prizrak) {
    var bylo = S.M;
    if (prizrak) zapomnit(prizrak); else if (o == null) { S.prizrak = null; }
    Object.assign(S.p, o || {});
    if (!o || o.seed == null) S.p.seed = (Math.random() * 4294967296) >>> 0;
    S.p.kT = bylo.kT;
    S.M = novyjPr(S.p);
    obnovit();
  }

  function step(dt) {
    var M = S.M, sk = (S.bystro ? SKB_PR : SK_PR) * (M.stoyat ? SKM_PR : 1);
    M.g.advance(dt * sk * M.tau1);
    /* табло на канве и строка под сценой берут одно снятие: один таймер */
    ui.current.st += dt;
    if (ui.current.st >= 0.2) { ui.current.st = 0; obnovit(); }
  }

  /* ── рисунок ── */

  function yashchik(ctx, M, ink, mut) {
    var g = M.g, rB = Math.max(1.6, g.d / 2 * B12), p = g.pos(M.buf), i, L;
    var wx0 = BX12 - g.d / 2 * B12, wy0 = BY12 - g.d / 2 * B12, wl = B12 + g.d * B12;
    ctx.strokeStyle = 'rgba(' + ink + ',.75)'; ctx.lineWidth = 2;
    ctx.strokeRect(wx0, wy0, wl, wl);
    /* мишени (все, кроме летящих) серым туманом по шести слоям глубины;
       когда мишени движутся, летят все, и туманом идут все, кроме следа */
    for (L = 0; L < 6; L++) {
      ctx.fillStyle = 'rgba(' + mut + ',' + (0.07 + 0.035 * L).toFixed(3) + ')';
      ctx.beginPath();
      for (i = 0; i < N_PR; i++) {
        if (i === M.tr || (M.stoyat && i < M.K)) continue;
        if (Math.min(5, Math.floor(p[3 * i + 2] * 6)) !== L) continue;
        var X = BX12 + p[3 * i] * B12, Y = BY12 + (1 - p[3 * i + 1]) * B12;
        ctx.moveTo(X + rB, Y); ctx.arc(X, Y, rB, 0, 2 * Math.PI);
      }
      ctx.fill();
    }
    if (M.stoyat) {
      ctx.fillStyle = 'rgb(' + CM + ')'; ctx.beginPath();
      for (i = 0; i < M.K; i++) {
        if (i === M.tr) continue;
        var Xm = BX12 + p[3 * i] * B12, Ym = BY12 + (1 - p[3 * i + 1]) * B12;
        ctx.moveTo(Xm + rB + 0.5, Ym); ctx.arc(Xm, Ym, rB + 0.5, 0, 2 * Math.PI);
      }
      ctx.fill();
    }
    /* след: отрезки пути, точки на ударах о соседей */
    var sl = M.sled, j = M.tr, Xt = BX12 + p[3 * j] * B12, Yt = BY12 + (1 - p[3 * j + 1]) * B12;
    ctx.strokeStyle = 'rgba(' + CT13 + ',.9)'; ctx.lineWidth = 2; ctx.beginPath();
    for (i = 0; i < sl.length; i++) {
      var Xs = BX12 + sl[i][0] * B12, Ys = BY12 + (1 - sl[i][1]) * B12;
      if (i) ctx.lineTo(Xs, Ys); else ctx.moveTo(Xs, Ys);
    }
    ctx.lineTo(Xt, Yt); ctx.stroke();
    ctx.fillStyle = 'rgb(' + CT13 + ')';
    for (i = 0; i < sl.length; i++) {
      if (!sl[i][2]) continue;
      ctx.beginPath(); ctx.arc(BX12 + sl[i][0] * B12, BY12 + (1 - sl[i][1]) * B12, 3, 0, 2 * Math.PI); ctx.fill();
    }
    ctx.beginPath(); ctx.arc(Xt, Yt, rB + 1.5, 0, 2 * Math.PI); ctx.fill();
    ctx.strokeStyle = 'rgba(' + ink + ',.9)'; ctx.lineWidth = 1.2; ctx.stroke();
    C.label(ctx, BX12 + B12 / 2, 30, M.stoyat ? '1550 мишеней стоят, 50 молекул летят' : '1600 молекул, вид сбоку', 17, 'rgba(' + mut + ',.95)');
  }

  function gisto(ctx, M, q, ink, mut) {
    var lg = S.log, XM = lg ? XG_PR : XL_PR, i, b, X, Y;
    function px(l) { return TX0_PR + l / XM * (TX1_PR - TX0_PR); }
    function py(w) {
      if (lg) {
        var e = w > 0 ? Math.log10(w) : YG0_PR - 1;
        return TY1_PR - (Math.max(YG0_PR, Math.min(YG1_PR, e)) - YG0_PR) / (YG1_PR - YG0_PR) * (TY1_PR - TY0_PR);
      }
      return TY1_PR - Math.min(1.04, w / YL_PR) * (TY1_PR - TY0_PR);
    }
    C.label(ctx, TX0_PR, 32, (M.stoyat ? 'пробеги летящих молекул' : 'пробеги всех молекул') + ': плотность w(l), в 1/λ', 17, 'rgba(' + mut + ',.95)', 'left');
    /* оси */
    ctx.strokeStyle = 'rgba(' + ink + ',.5)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(TX0_PR, TY0_PR); ctx.lineTo(TX0_PR, TY1_PR); ctx.lineTo(TX1_PR, TY1_PR); ctx.stroke();
    for (i = 0; i <= XM; i++) {
      X = px(i); ctx.beginPath(); ctx.moveTo(X, TY1_PR); ctx.lineTo(X, TY1_PR + 5); ctx.stroke();
      if (i < XM) C.label(ctx, X, TY1_PR + 24, String(i), 17, 'rgba(' + mut + ',.95)');
    }
    C.label(ctx, TX1_PR, TY1_PR + 24, 'l, в λ', 17, 'rgba(' + mut + ',.95)', 'right');
    var yt = lg ? [[1, '1'], [0.1, '0,1'], [0.01, '0,01'], [0.001, '0,001']] : [[0.5, '0,5'], [1, '1']];
    yt.forEach(function (t) {
      Y = py(t[0]);
      ctx.strokeStyle = 'rgba(' + ink + ',.12)'; ctx.beginPath(); ctx.moveTo(TX0_PR, Y); ctx.lineTo(TX1_PR, Y); ctx.stroke();
      C.label(ctx, TX0_PR - 6, Y + 6, t[1], 15, 'rgba(' + mut + ',.95)', 'right');
    });
    ctx.save(); ctx.beginPath(); ctx.rect(TX0_PR, TY0_PR - 8, TX1_PR - TX0_PR, TY1_PR - TY0_PR + 8); ctx.clip();
    /* столбики */
    var bw = px(DH_PR) - px(0);
    if (q.paths) {
      ctx.fillStyle = 'rgba(' + CM + ',.6)';
      for (b = 0; b < NB_PR; b++) {
        var l0 = b * DH_PR;
        if (l0 >= XM || !(q.hist[b] > 0)) continue;
        Y = py(q.hist[b]);
        ctx.fillRect(px(l0) + 1, Y, bw - 2, TY1_PR - Y);
      }
    }
    /* прежняя гистограмма пунктиром */
    var pr = q.prizrak;
    if (pr) {
      ctx.save(); ctx.setLineDash([6, 4]); ctx.strokeStyle = 'rgba(' + ink + ',.75)'; ctx.lineWidth = 1.6; ctx.beginPath();
      var started = false;
      for (b = 0; b < NB_PR; b++) {
        var a0 = b * DH_PR;
        if (a0 >= XM) break;
        if (lg && !(pr.hist[b] > 0)) { started = false; continue; }
        Y = py(pr.hist[b]);
        if (!started) { ctx.moveTo(px(a0), Y); started = true; } else ctx.lineTo(px(a0), Y);
        ctx.lineTo(px(a0 + DH_PR), Y);
      }
      ctx.stroke(); ctx.restore();
    }
    /* экспонента с тем же средним */
    if (q.meanL != null) {
      var m = q.meanL;
      ctx.strokeStyle = 'rgba(' + ink + ',.95)'; ctx.lineWidth = 2.2; ctx.beginPath();
      for (i = 0; i <= 200; i++) {
        var l = XM * i / 200; X = px(l); Y = py(Math.exp(-l / m) / m);
        if (i) ctx.lineTo(X, Y); else ctx.moveTo(X, Y);
      }
      ctx.stroke();
      /* средний и медиана */
      var md = q.median * m;
      ctx.save(); ctx.lineWidth = 1.5; ctx.strokeStyle = 'rgb(' + CT13 + ')';
      ctx.setLineDash([6, 4]); ctx.beginPath(); ctx.moveTo(px(m), TY0_PR + 22); ctx.lineTo(px(m), TY1_PR); ctx.stroke();
      ctx.setLineDash([2, 4]); ctx.beginPath(); ctx.moveTo(px(md), TY0_PR + 22); ctx.lineTo(px(md), TY1_PR); ctx.stroke();
      ctx.restore();
    }
    ctx.restore();
    if (q.meanL != null) {
      /* подписи линий вне обрезки: медиана слева от своей линии, а если
         там тесно (в логарифме), справа строкой ниже */
      var mm = q.meanL, mdd = q.median * mm;
      C.label(ctx, px(mm) + 5, TY0_PR + 16, '⟨l⟩', 17, 'rgb(' + CT13 + ')', 'left');
      ctx.font = '17px "Golos Text", system-ui, sans-serif';
      var wMed = ctx.measureText('медиана').width;
      if (px(mdd) - 5 - wMed >= TX0_PR + 4) C.label(ctx, px(mdd) - 5, TY0_PR + 16, 'медиана', 17, 'rgb(' + CT13 + ')', 'right');
      else C.label(ctx, px(mdd) + 5, TY0_PR + 38, 'медиана', 17, 'rgb(' + CT13 + ')', 'left');
    }
    /* легенда справа сверху: гистограмма там уже низкая */
    var lx = TX1_PR - 285, ly = TY0_PR + 14;
    ctx.fillStyle = 'rgba(' + CM + ',.6)'; ctx.fillRect(lx, ly - 13, 24, 14);
    C.label(ctx, lx + 32, ly, 'пробеги, счёт', 17, 'rgba(' + ink + ',.9)', 'left');
    ctx.save(); ctx.lineWidth = 2.2; ctx.strokeStyle = 'rgba(' + ink + ',.95)';
    ctx.beginPath(); ctx.moveTo(lx, ly + 18); ctx.lineTo(lx + 24, ly + 18); ctx.stroke(); ctx.restore();
    C.label(ctx, lx + 32, ly + 24, 'экспонента с тем же ⟨l⟩', 17, 'rgba(' + ink + ',.9)', 'left');
    if (pr) {
      ctx.save(); ctx.setLineDash([6, 4]); ctx.lineWidth = 1.6; ctx.strokeStyle = 'rgba(' + ink + ',.75)';
      ctx.beginPath(); ctx.moveTo(lx, ly + 42); ctx.lineTo(lx + 24, ly + 42); ctx.stroke(); ctx.restore();
      C.label(ctx, lx + 32, ly + 48, pr.label, 17, 'rgba(' + ink + ',.9)', 'left');
    }
    if (!q.paths) C.label(ctx, (TX0_PR + TX1_PR) / 2, TY1_PR - 20, 'пробеги копятся', 17, 'rgba(' + mut + ',.95)');
  }

  function stroka(ctx, q, ink, mut) {
    var Y = 384, m = 'rgba(' + mut + ',.95)';
    C.readout(ctx, 210, Y, 'СРЕДНИЙ ⟨l⟩', q.meanL != null ? num(q.meanL, 2) + ' λ' : '—', 'rgb(' + CM + ')');
    C.label(ctx, 210, Y + 66, q.stoyat ? '1/(nσχ) = 1,41 λ' : 'λ = 1/(√2 nσχ)', 17, m, 'right');
    C.readout(ctx, 405, Y, 'УДАРОВ ЗА ЕД.', q.nu != null ? chisloNu(q.nu) : '—', 'rgb(' + ink + ')');
    C.label(ctx, 405, Y + 66, (q.stoyat ? 'nσ⟨v⟩χ = ' : '√2 nσ⟨v⟩χ = ') + chisloNu(q.nuTheory), 17, m, 'right');
    C.readout(ctx, 600, Y, 'ДЛИННЕЕ ⟨l⟩', q.fracOverMean != null ? num(q.fracOverMean, 3) : '—', 'rgb(' + CT13 + ')');
    C.label(ctx, 600, Y + 66, 'одна экспонента 0,368', 17, m, 'right');
    C.readout(ctx, 795, Y, 'МЕДИАНА', q.median != null ? num(q.median, 2) + ' ⟨l⟩' : '—', 'rgb(' + CT13 + ')');
    C.label(ctx, 795, Y + 66, 'одна экспонента 0,69', 17, m, 'right');
    if (q.stoyat) {
      C.readout(ctx, 990, Y, 'К ДВИЖУЩИМСЯ', q.ratio != null ? num(q.ratio, 2) : '—', 'rgb(' + CM + ')');
      C.label(ctx, 990, Y + 66, q.ratio != null ? '√2 = 1,41' : 'нет счёта с движущимися', 17, m, 'right');
    } else {
      C.readout(ctx, 990, Y, 'ПРОБЕГОВ', tysyachi(q.paths), 'rgb(' + ink + ')');
      C.label(ctx, 990, Y + 66, q.pathsAll > q.paths ? 'последние ' + tysyachi(KOLCO_PR) : 'с начала счёта', 17, m, 'right');
    }
  }

  function draw(ctx) {
    var tone = C.tones(ctx), ink = tone.ink, mut = tone.muted;
    var q = pokazP;
    if (q.N == null) return;
    yashchik(ctx, S.M, ink, mut);
    gisto(ctx, S.M, q, ink, mut);
    stroka(ctx, q, ink, mut);
    ctx.textAlign = 'center';
  }

  var ref = C.useStage(W, HGT, step, draw);

  /* ── ручки ── */

  function dvigatKT(v) {
    var i = Math.max(0, Math.min(KT_PR.length - 1, Math.round(v)));
    if (KT_PR[i] === S.M.kT) return;
    zapomnit('при kT = ' + chisloKT(S.M.kT));
    kTPr(S.M, KT_PR[i]); sbrosPr(S.M); S.p.kT = KT_PR[i];
    obnovit();
  }
  function dvigatEtaPr(v) {
    var i = Math.max(0, Math.min(DOLI_PR.length - 1, Math.round(v)));
    if (DOLI_PR[i] === S.p.eta) return;
    zanovo({ eta: DOLI_PR[i] }, 'при доле ' + num(S.p.eta, 2));
  }
  function stoyat() { zanovo({ stoyat: !S.p.stoyat }, S.p.stoyat ? 'мишени стоят' : 'мишени движутся'); }
  function logBtn() { S.log = !S.log; obnovit(); }
  function bystro() { S.bystro = !S.bystro; obnovit(); }

  /* Для автопроверки: __demoSet({ eta, stoyat, seed, kT, log, bystro }):
     eta, stoyat или seed создают газ заново (пунктиром остаётся прежняя
     гистограмма, как у ручек), kT меняет температуру на ходу, как
     ползунок; __demoRun(T): T единиц времени модели кусками по τ/4 без
     отрисовки. */
  window.__demoSet = function (o) {
    o = o || {};
    if (o.eta || o.stoyat != null || o.seed != null) {
      var p = {}, lab = null;
      if (o.eta && o.eta !== S.p.eta) { p.eta = o.eta; lab = 'при доле ' + num(S.p.eta, 2); }
      if (o.stoyat != null && !!o.stoyat !== S.p.stoyat) { p.stoyat = !!o.stoyat; lab = S.p.stoyat ? 'мишени стоят' : 'мишени движутся'; }
      if (o.seed != null) p.seed = o.seed;
      if (o.zanovo) { S.prizrak = null; S.prezhnij = null; lab = null; }
      zanovo(p, lab);
    }
    if (o.kT != null && o.kT !== S.M.kT) dvigatKT(KT_PR.indexOf(o.kT));
    if (o.log != null) S.log = !!o.log;
    if (o.bystro != null) S.bystro = !!o.bystro;
    obnovit();
    return pokazP;
  };
  window.__demoRun = function (T) {
    var h = S.M.tau1 / 4, n = Math.round(T / h);
    for (var i = 0; i < n; i++) S.M.g.advance(h);
    obnovit();
    return pokazP;
  };
  window.__demoModel = { G: G, get M() { return S.M; }, get S() { return S; }, novyj: novyjPr, kT: kTPr, stats: statsPr,
                         pokazaniya: pokazaniyaPr, N: N_PR, K: K_PR, KOLCO: KOLCO_PR, PROGREV: PROGREV_PR, DH: DH_PR, NB: NB_PR };

  function slovaPr() {
    var q = pokazP, A = function (x) { return '<span class="accent">' + x + '</span>'; }, pr = q.prizrak, txt;
    if (q.meanL == null || q.paths < 2000) return q.stoyat
      ? 'Мишени стоят: 1550 молекул в 10¹⁰ раз тяжелее остальных, летят 50. Пробеги копятся.'
      : 'Гистограмма собирает пробеги всех молекул: путь между двумя ударами о соседей, у оранжевой молекулы он нарисован. Пробеги копятся.';
    if (pr && !pr.stoyat && !q.stoyat && pr.eta === q.eta && pr.kT !== q.kT && pr.nu)
      return 'kT стала ' + chisloKT(q.kT) + ' вместо ' + chisloKT(pr.kT) + ': скорости молекул ' +
        (q.kT > pr.kT ? 'выросли в ' + num(Math.sqrt(q.kT / pr.kT), 1) : 'упали в ' + num(Math.sqrt(pr.kT / q.kT), 1)) +
        ' раза, и ударов за единицу времени ' + A(chisloNu(q.nu)) + ' против ' + chisloNu(pr.nu) + '. А гистограмма легла на пунктир прежней: ' +
        'концентрация та же, и в показателе экспоненты температуры нет.';
    if (q.stoyat) {
      txt = 'Мишени стоят: 1550 молекул в 10¹⁰ раз тяжелее остальных, летят 50. Средний пробег ' + A(num(q.meanL, 2)) + ' λ';
      txt += q.ratio != null ? ', в ' + A(num(q.ratio, 2)) + ' раза длиннее, чем среди движущихся мишеней, а по формуле в √2 = 1,41 раза.' : '.';
      return txt + ' Мишени не летят навстречу, и молекула встречает их реже. По формуле 1/(nσχ) пробег был бы 1,41 λ, но у стенок молекуле не хватает мишеней. ' +
        'Пробег теперь от её скорости не зависит, и распределение ближе к одной экспоненте: доля длиннее среднего ' +
        A(num(q.fracOverMean, 3)) + '.';
    }
    return 'Гистограмма собирает пробеги всех молекул: путь между двумя ударами о соседей, у оранжевой молекулы он нарисован. Доля пробегов длиннее среднего ' +
      A(num(q.fracOverMean, 3)) + ' при 0,368 у одной экспоненты: быстрая молекула пролетает дальше медленной, и распределение есть смесь экспонент. ' +
      'Ударов на ' + A(num(100 * (1 - q.nuRel), 0) + ' %') + ' меньше формулы, и средний пробег ' + A(num(q.meanL, 2)) + ' λ: у стенки молекуле не хватает соседей.';
  }

  var iE = DOLI_PR.indexOf(S.p.eta), iK = KT_PR.indexOf(S.M.kT);
  return html`
    <div class="demo">
      <div class="controls">
        <${C.Slider} label="Доля объёма:" min=${0} max=${DOLI_PR.length - 1} step=${1} value=${iE}
                     onChange=${dvigatEtaPr} display=${num(S.p.eta, 2)} />
        <${C.Slider} label="Температура:" min=${0} max=${KT_PR.length - 1} step=${1} value=${iK}
                     onChange=${dvigatKT} display=${"kT = " + chisloKT(S.M.kT)} />
        <${C.Group}>
          <${C.Btn} active=${S.p.stoyat} onClick=${stoyat}>мишени стоят<//>
          <${C.Btn} active=${S.log} onClick=${logBtn}>логарифм<//>
          <${C.Btn} active=${S.bystro} onClick=${bystro}>быстро<//>
          <${C.Btn} action=${true} onClick=${function () { S.prezhnij = null; zanovo(); }}>Заново<//>
        <//>
      </div>
      <canvas class="stage" ref=${ref}></canvas>
      <${C.Status} html=${slovaPr()} />
    </div>`;
}

C.mount(PROBEGI13 ? Probegi13 : OBLAKO13 ? Oblako13 : TYAZH13 ? Tyazhelaya13 : NEDELYA12 ? (OKNO12 ? Okno12 : Maksvell12) : Gaz);
</script>
