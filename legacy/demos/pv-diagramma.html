/* ── чистая физика ──────────────────────────────────────────────
   Отсюда до пометки «конец чистой физики» код не знает о браузере и
   прогоняется в node. */

var R = 8.314462618;            /* Дж/(моль·К), k·N_A */
var NU = 1;                     /* моль */
var LITR = 1e-3;                /* м³ */
var M_UDV = 2000;               /* шагов поршня на удвоение объёма */
var N_IZOH = 2000;              /* шагов изохоры по давлению */
var T_1 = 300, V_1 = 10 * LITR; /* начало политроп */
var V2_MIN = 5 * LITR, V2_MAX = 40 * LITR;
var N_MIN = -1, N_MAX = 3;
var P_A = 2e5, V_A = 10 * LITR, P_B = 1e5, V_B = 20 * LITR;   /* концы трёх путей */

function gaz(i) {
  var Cv = i / 2 * NU * R;
  return { i: i, Cv: Cv, Cp: Cv + NU * R, gamma: (i + 2) / i };
}
function temp(P, V) { return P * V / (NU * R); }

/* Узлы политропы P V^n = const от (Va, Pa) до объёма Vb: давление по
   закону процесса, объём геометрически, M_UDV шагов на удвоение. */
function uzlyPolitropy(Va, Pa, n, Vb) {
  var udv = Math.log(Vb / Va) / Math.LN2, zn = udv < 0 ? -1 : 1;
  var K = Math.max(1, Math.ceil(Math.abs(udv) * M_UDV - 1e-6));
  var V = new Float64Array(K + 1), P = new Float64Array(K + 1);
  for (var k = 0; k <= K; k++) {
    V[k] = k === K ? Vb : Va * Math.pow(2, zn * k / M_UDV);
    P[k] = Pa * Math.pow(Va / V[k], n);
  }
  return { V: V, P: P, udv: udv };
}
/* Узлы изохоры: объём стоит, давление шагает от Pa до Pb. */
function uzlyIzohory(V, Pa, Pb) {
  var K = N_IZOH, VV = new Float64Array(K + 1), P = new Float64Array(K + 1);
  for (var k = 0; k <= K; k++) { VV[k] = V; P[k] = k === K ? Pb : Pa + (Pb - Pa) * k / K; }
  return { V: VV, P: P, udv: 0 };
}

/* Отрезок пути: суммы по шагам. storona — куда от линии ставить подпись
   теплоты на рисунке. */
function otrezok(imya, uzly, g, storona) {
  var V = uzly.V, P = uzly.P, K = V.length - 1;
  var A = new Float64Array(K + 1), U = new Float64Array(K + 1), Q = new Float64Array(K + 1);
  var QP = new Float64Array(K + 1), QM = new Float64Array(K + 1);
  /* десятая неделя: температура узла Tu и ∫δQ/T от начала отрезка Su,
     δQ/T при средней температуре шага; суммы девятой этим не задеты */
  var TU = new Float64Array(K + 1), SU = new Float64Array(K + 1);
  var T = temp(P[0], V[0]);
  TU[0] = T;
  for (var k = 0; k < K; k++) {
    var dA = 0.5 * (P[k] + P[k + 1]) * (V[k + 1] - V[k]);
    var T2 = temp(P[k + 1], V[k + 1]);
    var dU = g.Cv * (T2 - T);
    var dQ = dU + dA;
    A[k + 1] = A[k] + dA; U[k + 1] = U[k] + dU; Q[k + 1] = Q[k] + dQ;
    QP[k + 1] = QP[k] + (dQ > 0 ? dQ : 0); QM[k + 1] = QM[k] + (dQ < 0 ? dQ : 0);
    SU[k + 1] = SU[k] + dQ / (0.5 * (T + T2)); TU[k + 1] = T2;
    T = T2;
  }
  var masht = Math.abs(A[K]) + Math.abs(U[K]) + 1e-9;
  return {
    imya: imya, V: V, P: P, A: A, U: U, Q: Q, QP: QP, QM: QM, K: K, udv: uzly.udv, Tu: TU, Su: SU,
    T1: temp(P[0], V[0]), T2: temp(P[K], V[K]), storona: storona || 'up',
    /* знак теплоты на отрезке; ноль, если она в пределах счёта */
    znakQ: Math.abs(Q[K]) < 1e-6 * masht ? 0 : Q[K] > 0 ? 1 : -1,
    znakA: Math.abs(A[K]) < 1e-9 * masht ? 0 : A[K] > 0 ? 1 : -1
  };
}

/* Путь: отрезки подряд, итоги сумм. */
function put(imya, otrezki) {
  var p = { imya: imya, otrezki: otrezki, K: 0, A: 0, Q: 0, dU: 0, Qp: 0, Qm: 0, S: 0 };
  otrezki.forEach(function (s) {
    p.K += s.K; p.A += s.A[s.K]; p.Q += s.Q[s.K]; p.dU += s.U[s.K];
    p.Qp += s.QP[s.K]; p.Qm += s.QM[s.K]; p.S += s.Su[s.K];
  });
  return p;
}

/* Состояние на доле хода dolya от 0 до 1: номер отрезка, шаг и суммы. */
function naHodu(p, dolya) {
  var j = Math.round(Math.max(0, Math.min(1, dolya)) * p.K);
  var A = 0, Q = 0, U = 0, Qp = 0, Qm = 0, Sn = 0, m, s;
  for (m = 0; m < p.otrezki.length; m++) {
    s = p.otrezki[m];
    if (j <= s.K || m === p.otrezki.length - 1) break;
    A += s.A[s.K]; Q += s.Q[s.K]; U += s.U[s.K]; Qp += s.QP[s.K]; Qm += s.QM[s.K]; Sn += s.Su[s.K];
    j -= s.K;
  }
  var k = Math.min(j, s.K);
  return { m: m, k: k, V: s.V[k], P: s.P[k], T: temp(s.P[k], s.V[k]),
           A: A + s.A[k], Q: Q + s.Q[k], dU: U + s.U[k], Qp: Qp + s.QP[k], Qm: Qm + s.QM[k], S: Sn + s.Su[k] };
}

/* Политропа из 300 К и 10 л; n === Infinity — изохора до P₂ = P₁V₁/V₂. */
function politropa(i, n, V2) {
  var g = gaz(i), P1 = NU * R * T_1 / V_1, s;
  if (n === Infinity) s = otrezok('изохора', uzlyIzohory(V_1, P1, P1 * V_1 / V2), g, 'right');
  else s = otrezok('политропа', uzlyPolitropy(V_1, P1, n, V2), g, n === 0 ? 'up' : n < 0 ? 'ul' : 'ur');
  var p = put('politropa', [s]);
  p.g = g; p.n = n; p.P1 = P1; p.V1 = V_1; p.P2 = s.P[s.K]; p.V2 = s.V[s.K];
  p.T1 = s.T1; p.T2 = s.T2;
  var dT = s.T2 - s.T1;
  p.dT = Math.abs(dT) < 1e-9 * T_1 ? 0 : dT;
  p.C = p.dT === 0 ? (Math.abs(p.Q) < 1e-6 ? null : Infinity) : p.Q / dT;
  /* формулы для сверки, в счёт не входят */
  p.Cformula = n === Infinity ? g.Cv : n === 1 ? Infinity : g.Cv * (n - g.gamma) / (n - 1);
  p.Aformula = n === Infinity ? 0 : n === 1 ? NU * R * T_1 * Math.log(V2 / V_1)
    : (P1 * V_1 - p.P2 * p.V2) / (n - 1);
  /* работа по удвоениям объёма: границы удвоений лежат в узлах */
  p.udvoeniya = [];
  if (n !== Infinity) {
    var polnyh = Math.floor(Math.abs(s.udv) + 1e-9), zn = s.udv < 0 ? -1 : 1, b;
    for (b = 0; b < polnyh; b++)
      p.udvoeniya.push({ Va: V_1 * Math.pow(2, zn * b), Vb: V_1 * Math.pow(2, zn * (b + 1)),
                         A: s.A[(b + 1) * M_UDV] - s.A[b * M_UDV] });
    if (polnyh * M_UDV < s.K && polnyh > 0)
      p.udvoeniya.push({ Va: V_1 * Math.pow(2, zn * polnyh), Vb: s.V[s.K],
                         A: s.A[s.K] - s.A[polnyh * M_UDV], chast: true });
  }
  return p;
}

/* Три пути из (P_A; V_A) в (P_B; V_B) и цикл туда путём 1, обратно путём 3. */
function triPuti(i) {
  var g = gaz(i);
  function izobara(P, Va, Vb, st) { return otrezok('изобара', uzlyPolitropy(Va, P, 0, Vb), g, st); }
  function izohora(V, Pa, Pb, st) { return otrezok('изохора', uzlyIzohory(V, Pa, Pb), g, st); }
  var puti = {
    1: put('1', [izobara(P_A, V_A, V_B, 'up'), izohora(V_B, P_A, P_B, 'right')]),
    2: put('2', [otrezok('изотерма', uzlyPolitropy(V_A, P_A, 1, V_B), g, 'ur')]),
    3: put('3', [izohora(V_A, P_A, P_B, 'left'), izobara(P_B, V_A, V_B, 'up')]),
    cikl: put('cikl', [izobara(P_A, V_A, V_B, 'up'), izohora(V_B, P_A, P_B, 'right'),
                       izobara(P_B, V_B, V_A, 'down'), izohora(V_A, P_B, P_A, 'left')])
  };
  puti.g = g; puti.T = temp(P_A, V_A);
  puti.Tugly = [temp(P_A, V_B), temp(P_B, V_A)];   /* углы путей 1 и 3 */
  return puti;
}

/* ── добавка десятой недели: два цикла ──────────────────────────
   Счёт тот же, что выше: участки по закону процесса, суммы по шагам. Новое
   в том, как собраны участки, и в температуре резервуара Trez у тех, где
   идёт теплообмен (у адиабат резервуара нет). */
var T_ODIN = 300, V_ODIN = 10 * LITR, V_KARNO = 10 * LITR, C0K = 273.15;

/* Итоги цикла: суммы пути, ∮δQ/T газа и ∮δQ/T_рез (теплота участка,
   делённая на температуру его резервуара; у адиабат берётся их ∫δQ/T, он
   ноль с точностью счёта), крайние температуры по узлам, углы с координатой
   S от начала цикла, невязка замыкания по V и P. */
function cikl(imya, otrezki, imena, g) {
  var p = put(imya, otrezki), Sn = 0;
  p.g = g; p.Srez = 0; p.Tmin = Infinity; p.Tmax = 0; p.ugly = [];
  otrezki.forEach(function (s, j) {
    p.Srez += s.Trez ? s.Q[s.K] / s.Trez : s.Su[s.K];
    for (var k = 0; k <= s.K; k++) { if (s.Tu[k] < p.Tmin) p.Tmin = s.Tu[k]; if (s.Tu[k] > p.Tmax) p.Tmax = s.Tu[k]; }
    p.ugly.push({ imya: imena[j], V: s.V[0], P: s.P[0], T: s.Tu[0], S: Sn });
    Sn += s.Su[s.K];
  });
  var a = otrezki[0], b = otrezki[otrezki.length - 1];
  p.zamykanie = Math.abs(b.V[b.K] / a.V[0] - 1) + Math.abs(b.P[b.K] / a.P[0] - 1);
  return p;
}

/* Один резервуар при 300 К: изотерма 1–2 от 10 л до r·10 л, адиабата 2–3
   назад до 10 л, изохора 3–1 остужает газ о тот же резервуар. */
function odinRezervuar(i, r) {
  var g = gaz(i), V1 = V_ODIN, P1 = NU * R * T_ODIN / V1;
  var a = otrezok('изотерма', uzlyPolitropy(V1, P1, 1, r * V1), g, 'down');
  var b = otrezok('адиабата', uzlyPolitropy(a.V[a.K], a.P[a.K], g.gamma, V1), g);
  var c = otrezok('изохора', uzlyIzohory(V1, b.P[b.K], P1), g, 'right');
  a.Trez = T_ODIN; c.Trez = T_ODIN;
  var p = cikl('odin', [a, b, c], ['1', '2', '3'], g);
  p.r = r; p.Tres = T_ODIN;
  return p;
}

/* Цикл Карно между T_H и T_X: изотерма 1–2 при T_H от 10 л до r·10 л,
   адиабата 2–3 до T_X, изотерма 3–4 при T_X, адиабата 4–1. Концы адиабат
   задаёт их закон T V^(γ−1) = const: V₃ = kV₂, V₄ = kV₁,
   k = (T_H/T_X)^(1/(γ−1)). Обратный ход проходит те же точки в порядке
   1, 4, 3, 2. Каждый участок начинается там, где кончился предыдущий,
   поэтому невязка замыкания и есть проверка закона адиабаты. */
function karno(i, TH, TX, r, nazad) {
  var g = gaz(i), k = Math.pow(TH / TX, 1 / (g.gamma - 1));
  var V1 = V_KARNO, V2 = r * V1, V3 = k * V2, V4 = k * V1, P1 = NU * R * TH / V1, s = [];
  function dalee(imya, Vb, n, storona) {
    var pr = s.length ? s[s.length - 1] : null;
    s.push(otrezok(imya, uzlyPolitropy(pr ? pr.V[pr.K] : V1, pr ? pr.P[pr.K] : P1, n, Vb), g, storona));
  }
  if (!nazad) {
    dalee('изотерма', V2, 1, 'ur'); dalee('адиабата', V3, g.gamma);
    dalee('изотерма', V4, 1, 'dl'); dalee('адиабата', V1, g.gamma);
    s[0].Trez = TH; s[2].Trez = TX;
  } else {
    dalee('адиабата', V4, g.gamma); dalee('изотерма', V3, 1, 'dl');
    dalee('адиабата', V2, g.gamma); dalee('изотерма', V1, 1, 'ur');
    s[1].Trez = TX; s[3].Trez = TH;
  }
  var p = cikl('karno', s, nazad ? ['1', '4', '3', '2'] : ['1', '2', '3', '4'], g);
  var gor = s[nazad ? 3 : 0], hol = s[nazad ? 1 : 2];
  p.TH = TH; p.TX = TX; p.r = r; p.k = k; p.nazad = !!nazad;
  p.QH = gor.Q[gor.K]; p.QX = hol.Q[hol.K];
  p.shirina = Math.abs(gor.Su[gor.K]);          /* ширина прямоугольника на T–S */
  return p;
}
/* ── конец чистой физики ── */

/* Русская запятая и настоящий минус; крохи печатаются нулём. */
function num(v, d) {
  if (v == null || !isFinite(v)) return v === Infinity || v === -Infinity ? '∞' : '—';
  if (Math.abs(v) < 0.5 * Math.pow(10, -d)) v = 0;
  return v.toFixed(d).replace('.', ',').replace('-', '−');
}
/* Джоули целыми, с пробелом в тысячах от десяти тысяч. */
function dzh(v) {
  var t = num(v, 0), m = /^(−?)(\d+)$/.exec(t);
  if (m && m[2].length >= 5) t = m[1] + m[2].replace(/\B(?=(\d{3})+$)/g, ' ');
  return t;
}
function dzhZn(v) { var t = dzh(v); return v > 0 && t !== '0' ? '+' + t : t; }
function kPa(P) { return num(P / 1e3, P >= 1e6 ? 0 : 1); }
function litr(V) { return num(V / LITR, Math.abs(V / LITR - Math.round(V / LITR)) < 1e-9 ? 0 : 1); }

/* ══════════════════ сцена ══════════════════

   Слева плоскость P–V: путь окрашен по знаку теплоты (тёплый цвет газ
   получает теплоту, синий отдаёт, цвет чернил ноль), площадь под путём по
   знаку работы, стрелка показывает направление. Пунктиром изотерма и
   адиабата через начало (политропы) или изотермы через углы путей.
   Справа столбики A, Q и ΔU и показания. */

var W = 1000, HGT = 460;
var X0 = 100, X1 = 610, Y0 = 40, Y1 = 372;
var CV_A = '77,182,198';      /* работа газа */
var CV_MINUS = '200,80,140';  /* работа над газом */

var CV_OUT = '72,140,232';    /* газ отдаёт теплоту */
var CV_U = '160,130,220';     /* внутренняя энергия */

var SHAG_P = { 250000: 50e3, 300000: 100e3, 600000: 200e3, 1200000: 400e3, 2400000: 800e3 };

/* десятая неделя: цикл обходится за 6 с; при второй панели P–V уходит

var DLIT_CIKL = 6;
var TS_X0 = 590, TS_X1 = 955, TS_Y0 = 40, TS_Y1 = 296, RY_TS = 364;

var pokaz = {};
window.__demoState = pokaz;

function PV() {

  };
  var S = box.current;
  /* Десятая неделя: набор цикла (odin или karno), температуры Карно в °C,
     отношения объёмов изотерм у Карно и у одного резервуара, обратный ход,
     вторая панель. Режим «цикл» живёт только здесь. */
  if (NEDELYA10 && S.cikl == null) {
    S.cikl = 'odin'; S.tH = 100; S.tX = 20; S.rK = 2; S.rO = 5; S.nazad = START10.nazad; S.ts = START10.ts; S.put = 'vse';
    if (START10.rezhim === 'odin' || START10.rezhim === 'karno') { S.rezhim = 'cikl'; S.cikl = START10.rezhim; }

    if (S.kesh && S.kesh.klyuch === klyuch) return S.kesh.m;

     меняла масштаба. */
  function modelCikla() {

  function snyatCikl(m, z) {

    var nev = 0;
    c.ugly.forEach(function (u) { nev = Math.max(nev, Math.abs(u.S - Sf(u))); });
    Object.assign(pokaz, {
      set: S.cikl, r: c.r, reverse: kar && S.nazad,
      TH: kar ? c.TH : T_ODIN, TX: kar ? c.TX : T_ODIN, tH: kar ? S.tH : null, tX: kar ? S.tX : null,
      Tmin: c.Tmin, Tmax: c.Tmax,
      eta: c.A > 0 ? c.A / c.Qp : null,

  function snyat10(m, p, z) {

  function osi(ctx, v, ink, mut) {
    ctx.lineWidth = 1;
    for (var P = 0; P <= v.Pmax + 1; P += v.shagP) {
      var y = v.Y(P);
      ctx.strokeStyle = 'rgba(' + ink + ',' + (P === 0 ? '.45' : '.10') + ')';
      ctx.beginPath(); ctx.moveTo(X0, y); ctx.lineTo(X1, y); ctx.stroke();
      C.label(ctx, X0 - 8, y + 6, num(P / 1e3, 0), 17, mut, 'right');
    }
    v.vTicks.forEach(function (Vl) {
      var x = v.X(Vl * LITR);
      ctx.strokeStyle = 'rgba(' + ink + ',' + (Vl === 0 ? '.45' : '.10') + ')';
      ctx.beginPath(); ctx.moveTo(x, Y0); ctx.lineTo(x, Y1); ctx.stroke();
      C.label(ctx, x, Y1 + 24, String(Vl), 17, mut);
    });
    C.label(ctx, X0 - 8, Y0 - 16, 'P, кПа', 17, mut, 'right');
    C.label(ctx, X1, NEDELYA10 && S.ts ? Y1 + 46 : Y1 + 24, 'V, л', 17, mut, 'right');
  }

  /* Пунктирная кривая P(V) по всей ширине рамки. */
  function prizrak(ctx, v, fn, rgb, podpis, mut) {
    ctx.save();
    ctx.beginPath(); ctx.rect(X0, Y0 - 4, X1 - X0, Y1 - Y0 + 4); ctx.clip();
    ctx.setLineDash([6, 6]); ctx.strokeStyle = 'rgba(' + rgb + ',.45)'; ctx.lineWidth = 1.5;
    ctx.beginPath();
    for (var x = X0 + 4, first = true; x <= X1; x += 3) {
      var V = (x - X0) / (X1 - X0) * v.Vmax, y = v.Y(fn(V));
      if (y < Y0 - 400) { first = true; continue; }
      if (first) { ctx.moveTo(x, y); first = false; } else ctx.lineTo(x, y);
    }
    ctx.stroke();
    ctx.restore();
    if (podpis) C.label(ctx, podpis.x, podpis.y, podpis.t, 17, mut, podpis.al || 'right');
  }

  function zalivka(ctx, v, s, kmax, alpha) {
    if (kmax < 1 || s.znakA === 0) return;
    var rgb = s.znakA > 0 ? CV_A : CV_MINUS, sh = Math.max(1, Math.floor(kmax / 400));
    ctx.fillStyle = 'rgba(' + rgb + ',' + alpha + ')';
    ctx.beginPath(); ctx.moveTo(v.X(s.V[0]), v.Y(0));
    for (var k = 0; k <= kmax; k += sh) ctx.lineTo(v.X(s.V[k]), v.Y(s.P[k]));
    ctx.lineTo(v.X(s.V[kmax]), v.Y(s.P[kmax]));
    ctx.lineTo(v.X(s.V[kmax]), v.Y(0)); ctx.closePath(); ctx.fill();
  }

  function cvetQ(s, ink) { return s.znakQ > 0 ? CV_IN : s.znakQ < 0 ? CV_OUT : ink; }

  function liniya(ctx, v, s, kmax, ink, yarko) {
    liniyaXY(ctx, s, kmax, ink, yarko, function (k) { return v.X(s.V[k]); }, function (k) { return v.Y(s.P[k]); });
  }
  /* Та же линия в любых координатах узла: fx(k), fy(k). Десятая неделя
     рисует ею отрезок и на панели T–S. */
  function liniyaXY(ctx, s, kmax, ink, yarko, fx, fy) {
    var rgb = cvetQ(s, ink), sh = Math.max(1, Math.floor(s.K / 500));
    function chast(k0, k1, a, w, dash) {
      if (k1 <= k0) return;
      ctx.save(); if (dash) ctx.setLineDash([5, 5]);
      ctx.strokeStyle = 'rgba(' + rgb + ',' + a + ')'; ctx.lineWidth = w; ctx.lineJoin = 'round';
      ctx.beginPath(); ctx.moveTo(fx(k0), fy(k0));
      for (var k = k0 + sh; k < k1; k += sh) ctx.lineTo(fx(k), fy(k));
      ctx.lineTo(fx(k1), fy(k1)); ctx.stroke(); ctx.restore();
    }
    chast(kmax, s.K, .45, 1.8, true);
    chast(0, kmax, yarko ? 1 : .9, 3, false);
    /* стрелка направления в середине отрезка */
    var km = Math.floor(s.K / 2), k2 = Math.min(s.K, km + Math.max(2, Math.floor(s.K / 50)));
    var xa = fx(km), ya = fy(km), xb = fx(k2), yb = fy(k2);
    var a = Math.atan2(yb - ya, xb - xa);
    if (Math.hypot(xb - xa, yb - ya) < 0.5) return;
    ctx.fillStyle = 'rgba(' + rgb + ',' + (kmax >= km ? 1 : .5) + ')';
    ctx.beginPath(); ctx.moveTo(xa + 8 * Math.cos(a), ya + 8 * Math.sin(a));
    ctx.lineTo(xa - 8 * Math.cos(a) + 7 * Math.sin(a), ya - 8 * Math.sin(a) - 7 * Math.cos(a));
    ctx.lineTo(xa - 8 * Math.cos(a) - 7 * Math.sin(a), ya - 8 * Math.sin(a) + 7 * Math.cos(a));
    ctx.closePath(); ctx.fill();
  }

  /* Подпись теплоты отрезка: у прямых отрезков над серединой или сбоку, у
     кривых правее и выше точки на 0,62 хода, чтобы не лечь на стрелку. */
  function podpisQ(ctx, v, s, ink) {
    var kriv = s.storona === 'ur' || s.storona === 'ul';
    var km = Math.floor(s.K * (kriv ? 0.62 : 0.5)), x = v.X(s.V[km]), y = v.Y(s.P[km]);
    var t = 'Q = ' + dzhZn(s.Q[s.K]) + ' Дж', col = 'rgb(' + cvetQ(s, ink) + ')';
    if (s.storona === 'ur') C.label(ctx, x + 12, y - 12, t, 17, col, 'left');
    else if (s.storona === 'ul') C.label(ctx, x - 12, y - 12, t, 17, col, 'right');
    else if (s.storona === 'up') C.label(ctx, x, y - 14, t, 17, col, 'center');
    else if (s.storona === 'down') C.label(ctx, x, y + 26, t, 17, col, 'center');
    else if (s.storona === 'right') C.label(ctx, x + 12, y + 6, t, 17, col, 'left');
    else if (s.storona === 'dl') C.label(ctx, x - 10, y + 26, t, 17, col, 'right');   /* десятая неделя */
    else C.label(ctx, x - 12, y + 6, t, 17, col, 'right');
  }

  /* Подпись с нижними индексами: «C_V» рисуется как C с маленьким V ниже
     строки (на канве KaTeX нет). */
  function nadpisSub(ctx, x, y, text, size, color, align) {
    /* _{…} — индекс из нескольких букв, его берёт десятая неделя (T_{рез}) */
    var chasti = [], re = /_(\{[^}]*\}|[A-Za-z])/g, last = 0, mm;
    while ((mm = re.exec(text))) { chasti.push([text.slice(last, mm.index), false]); chasti.push([mm[1].replace(/^\{|\}$/g, ''), true]); last = re.lastIndex; }
    chasti.push([text.slice(last), false]);
    function shrift(sub) { return (sub ? Math.round(size * 0.72) : size) + 'px "Golos Text", system-ui, sans-serif'; }
    var w = 0;
    chasti.forEach(function (c) { ctx.font = shrift(c[1]); w += ctx.measureText(c[0]).width; });
    var x0 = align === 'right' ? x - w : align === 'center' ? x - w / 2 : x;
    ctx.fillStyle = color; ctx.textAlign = 'left';
    chasti.forEach(function (c) {
      ctx.font = shrift(c[1]); ctx.fillText(c[0], x0, y + (c[1] ? size * 0.25 : 0));
      x0 += ctx.measureText(c[0]).width;
    });
    ctx.textAlign = 'center';
  }

  function tochka(ctx, x, y, r, col) { ctx.fillStyle = col; ctx.beginPath(); ctx.arc(x, y, r, 0, 2 * Math.PI); ctx.fill(); }

  /* ── диаграмма ── */

  function diagramma(ctx, m, tone) {
    var ink = tone.ink, mut = 'rgba(' + tone.muted + ',.95)', v = vid(m);
    var puti = tekPuti(m), vse = S.rezhim === 'puti' && S.put === 'vse';
    /* десятая неделя, вторая панель: P–V узкая, подписи изотерм и теплот
       трёх путей уходят, их числа стоят на T–S и в нижнем ряду */
    var uzko = NEDELYA10 && S.ts;
    osi(ctx, v, ink, mut);

    if (S.rezhim === 'politropa') {
      /* подпись не ставится, если выбранный путь лёг на эту кривую */
      var p = m, P1V1 = p.P1 * p.V1, g = p.g, metki = v.Pmax === YARUSY[0];
      var naIzoterme = S.n === 1, naAdiabate = Math.abs(S.n - g.gamma) < 1e-12;
      /* и не ставится рядом с точкой 2 */
      var x2 = v.X(p.V2), y2 = v.Y(p.P2);
      var mesto = function (x, y) { return !(Math.abs(x - 40 - x2) < 70 && Math.abs(y - 6 - y2) < 26); };
      var Vm = 43 * LITR, xi = v.X(Vm), yi = v.Y(P1V1 / Vm) - 8, ya = v.Y(p.P1 * Math.pow(p.V1 / Vm, g.gamma)) + 22;
      prizrak(ctx, v, function (V) { return P1V1 / V; }, ink,
              metki && !naIzoterme && mesto(xi, yi) ? { x: xi, y: yi, t: 'изотерма' } : null, mut);
      prizrak(ctx, v, function (V) { return p.P1 * Math.pow(p.V1 / V, g.gamma); }, ink,
              metki && !naAdiabate && mesto(xi, ya) ? { x: xi, y: ya, t: 'адиабата' } : null, mut);
    } else {
      var T = m.T;
      [[m.Tugly[0], 23], [m.Tugly[1], 23]].forEach(function (q) {
        var PV0 = NU * R * q[0], Vl = q[1] * LITR;
        prizrak(ctx, v, function (V) { return PV0 / V; }, ink,
                uzko ? null : { x: v.X(Vl), y: v.Y(PV0 / Vl) - 8, t: num(q[0], 1) + ' К' }, mut);
      });
      /* изотерма концов: подпись под кривой, над ней стоит точка 2 */
      if (S.put !== 2 && !vse) prizrak(ctx, v, function (V) { return P_A * V_A / V; }, ink,
                uzko ? null : { x: v.X(23 * LITR), y: v.Y(P_A * V_A / (23 * LITR)) + 22, t: num(T, 1) + ' К' }, mut);
    }

    /* площади */
    var z0 = naHodu(puti[0], S.dolya);
    puti.forEach(function (p) {
      var z = naHodu(p, S.dolya);
      p.otrezki.forEach(function (s, j) {
        var kmax = j < z.m ? s.K : j === z.m ? z.k : 0;
        zalivka(ctx, v, s, kmax, vse ? .13 : S.put === 'cikl' && S.rezhim === 'puti' ? .26 : .22);
      });
    });
    /* удвоения объёма: границы и работа каждого */
    if (S.rezhim === 'politropa' && m.udvoeniya.length > 1 && S.dolya >= 1) {
      m.udvoeniya.forEach(function (u, b) {
        var xa = v.X(u.Va), xb = v.X(u.Vb);
        if (b > 0) {
          ctx.save(); ctx.setLineDash([4, 4]); ctx.strokeStyle = 'rgba(' + ink + ',.55)'; ctx.lineWidth = 1.2;
          ctx.beginPath(); ctx.moveTo(xa, v.Y(0)); ctx.lineTo(xa, v.Y(m.P1 * Math.pow(m.V1 / u.Va, m.n))); ctx.stroke(); ctx.restore();
        }
        if (Math.abs(xb - xa) >= 62) C.label(ctx, (xa + xb) / 2, v.Y(0) - 14, dzh(u.A) + ' Дж', 17, 'rgb(' + ink + ')');
      });
    }
    /* линии путей */
    puti.forEach(function (p) {
      var z = naHodu(p, S.dolya);
      p.otrezki.forEach(function (s, j) {
        var kmax = j < z.m ? s.K : j === z.m ? z.k : 0;
        liniya(ctx, v, s, kmax, ink, !vse);
      });
    });
    /* подписи */
    if (!vse && S.dolya >= 1 && !(uzko && S.rezhim === 'puti')) puti[0].otrezki.forEach(function (s) { if (s.znakQ !== 0 || S.rezhim === 'puti') podpisQ(ctx, v, s, ink); });
    if (S.rezhim === 'politropa' && S.dolya >= 1 && m.otrezki[0].znakQ === 0) {
      var s1 = m.otrezki[0], kk = Math.floor(s1.K * 0.62);
      C.label(ctx, v.X(s1.V[kk]) + 12, v.Y(s1.P[kk]) - 12, 'Q = 0', 17, 'rgb(' + ink + ')', 'left');
    }
    if (vse) {
      C.label(ctx, v.X(15 * LITR), v.Y(P_A) - 12, 'путь 1', 17, 'rgb(' + ink + ')');
      C.label(ctx, v.X(16.5 * LITR) + 6, v.Y(P_A * V_A / (16.5 * LITR)) - 12, 'путь 2', 17, 'rgb(' + ink + ')', 'left');
      C.label(ctx, v.X(12.5 * LITR), v.Y(P_B) - 12, 'путь 3', 17, 'rgb(' + ink + ')');
    }
    if (S.rezhim === 'puti' && S.put === 'cikl' && S.dolya >= 1)
      C.label(ctx, v.X(15 * LITR), v.Y(150e3) + 6, 'A цикла ' + dzh(m.cikl.A) + ' Дж', 17, 'rgb(' + ink + ')');

    /* начало, конец, нынешняя точка */
    var p0 = puti[0], s0a = p0.otrezki[0], sK = p0.otrezki[p0.otrezki.length - 1];
    var xa = v.X(s0a.V[0]), ya = v.Y(s0a.P[0]);
    var xk = S.rezhim === 'puti' ? v.X(V_B) : v.X(sK.V[sK.K]), yk = S.rezhim === 'puti' ? v.Y(P_B) : v.Y(sK.P[sK.K]);
    tochka(ctx, xa, ya, 5, 'rgb(' + ink + ')');
    C.label(ctx, xa - 10, ya - 10, '1', 19, 'rgb(' + ink + ')', 'right');
    if (Math.hypot(xk - xa, yk - ya) > 4) {
      tochka(ctx, xk, yk, 5, 'rgb(' + ink + ')');
      C.label(ctx, xk + 10, yk - 10, '2', 19, 'rgb(' + ink + ')', 'left');
    }
    if (S.dolya < 1 || S.idet) {
      puti.forEach(function (p) {
        var z = naHodu(p, S.dolya);
        C.glow(ctx, v.X(z.V), v.Y(z.P), 16, tone.accent, .5);
        tochka(ctx, v.X(z.V), v.Y(z.P), 6, 'rgb(' + tone.accent + ')');
      });
    }
    return z0;
  }

  /* ── столбики и показания ── */

  function stolbiki(ctx, z, full, ink) {
    var ryad = [['A', z.A, full.A, CV_A], ['Q', z.Q, full.Q, full.Q >= 0 ? CV_IN : CV_OUT], ['ΔU', z.dU, full.dU, CV_U]];
    var mx = 0, mn = 0;
    ryad.forEach(function (r) { mx = Math.max(mx, r[2]); mn = Math.min(mn, r[2]); });
    var span = mx - mn || 1, top = 64, bot = 272, y0 = top + (bot - top) * mx / span;
    ctx.strokeStyle = 'rgba(' + ink + ',.45)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(668, y0); ctx.lineTo(990, y0); ctx.stroke();
    [720, 830, 940].forEach(function (x, j) {
      var r = ryad[j], h = r[1] / span * (bot - top);
      if (Math.abs(h) > 0.5) {
        ctx.fillStyle = 'rgba(' + r[3] + ',.85)';
        ctx.fillRect(x - 24, Math.min(y0, y0 - h), 48, Math.abs(h));
      }
      C.label(ctx, x, 298, r[0], 19, 'rgb(' + r[3] + ')');
      C.label(ctx, x, 320, dzh(r[1]) + ' Дж', 17, 'rgb(' + ink + ')');
    });
  }

  function tablicaPutej(ctx, m, ink, mut) {

    var X = [690, 820, 905, 990];

    C.label(ctx, X[3], 70, 'ΔU, Дж', 17, 'rgb(' + CV_U + ')', 'right');
    [1, 2, 3].forEach(function (id, j) {
      var p = m[id], z = naHodu(p, S.dolya), y = 118 + 46 * j;
      C.label(ctx, X[0], y, String(id), 19, 'rgb(' + ink + ')', 'left');
      C.label(ctx, X[1], y, dzh(z.A), 19, 'rgb(' + ink + ')', 'right');
      C.label(ctx, X[2], y, dzh(z.Q), 19, 'rgb(' + ink + ')', 'right');
      C.label(ctx, X[3], y, dzh(z.dU), 19, 'rgb(' + ink + ')', 'right');
    });
  }

  function pokazaniya(ctx, m, z, tone) {
    var ink = tone.ink, mut = 'rgba(' + tone.muted + ',.95)', RY = 356;
    if (S.rezhim === 'politropa') {
      var p = m;
      C.readout(ctx, 815, RY, S.dolya < 1 ? 'T, К' : 'T₂, К', num(z.T, 1), 'rgb(' + ink + ')');
      var Cpok = S.dolya >= 1 ? p.C : (Math.abs(z.T - p.T1) < 1e-9 * T_1 ? null : z.Q / (z.T - p.T1));
      var Ctxt = Cpok == null ? '—' : num(Cpok, 2);
      C.readout(ctx, 990, RY, 'C, ДЖ/(МОЛЬ·К)', Ctxt, Ctxt.charAt(0) === '−' ? 'rgb(' + CV_OUT + ')' : 'rgb(' + ink + ')');
      var fA = S.n === Infinity ? 'A = 0: объём стоит' : 'формулой: ' + (S.n === 1 ? 'νRT ln(V₂/V₁) = '
        : Math.abs(S.n - p.g.gamma) < 1e-12 ? '(P₁V₁ − P₂V₂)/(γ − 1) = ' : '(P₁V₁ − P₂V₂)/(n − 1) = ') + dzh(p.Aformula) + ' Дж';
      var fC = 'формулой: ' + (S.n === Infinity ? 'C_V = ' + num(p.Cformula, 2) : S.n === 1 ? 'C_V(n − γ)/(n − 1) = ∞'
        : 'C_V(n − γ)/(n − 1) = ' + num(p.Cformula, 2));
      nadpisSub(ctx, 990, 420, fA, 17, mut, 'right');
      nadpisSub(ctx, 990, 444, fC, 17, mut, 'right');
    } else if (S.put === 'vse') {
      C.readout(ctx, 990, RY, 'T₁ = T₂, К', num(m.T, 1), 'rgb(' + ink + ')');
      C.label(ctx, 990, 432, 'концы на одной изотерме', 17, mut, 'right');
    } else {
      C.readout(ctx, 815, RY, 'ПОЛУЧЕНО, ДЖ', dzh(z.Qp), 'rgb(' + CV_IN + ')');
      C.readout(ctx, 990, RY, 'ОТДАНО, ДЖ', dzh(z.Qm), 'rgb(' + CV_OUT + ')');
      if (NEDELYA10) {
        /* десятая неделя: ∫δQ/T набранного хода строкой над подписью */
        C.label(ctx, 990, 420, (S.put === 'cikl' ? '∮δQ/T = ' : '∫δQ/T = ') + num(z.S, 3) + ' Дж/К', 17, mut, 'right');
        C.label(ctx, 990, 444, S.put === 'cikl' ? 'газ вернулся в состояние 1' : 'концы на изотерме ' + num(m.T, 1) + ' К', 17, mut, 'right');
      } else
      C.label(ctx, 990, 432, S.put === 'cikl' ? 'газ вернулся в состояние 1' : 'концы на изотерме ' + num(m.T, 1) + ' К', 17, mut, 'right');
    }
  }

  /* ══════════════ десятая неделя: отрисовка ══════════════ */

  /* Раскладка: без второй панели всё как у девятой; с ней P–V сжимается
     влево, T–S встаёт справа. Вызывается только под ?nedelya=10. */
  function raskladka() {
    if (S.ts) { X0 = 92; X1 = 452; Y0 = 40; Y1 = 296; }
    else { X0 = 100; X1 = 610; Y0 = 40; Y1 = 372; }
  }

  /* Таблица трёх путей со столбцом ∫δQ/T. */
  function tablicaPutej10(ctx, m, ink, mut) {
    var X = [676, 780, 858, 912, 990];
    C.label(ctx, X[0], 70, 'путь', 17, mut, 'left');
    C.label(ctx, X[1], 70, 'A', 17, 'rgb(' + CV_A + ')', 'right');
    C.label(ctx, X[2], 70, 'Q', 17, 'rgb(' + CV_IN + ')', 'right');

    C.label(ctx, X[4], 92, 'Дж/К', 17, mut, 'right');
    [1, 2, 3].forEach(function (id, j) {
      var p = m[id], z = naHodu(p, S.dolya), y = 136 + 46 * j;
      C.label(ctx, X[0], y, String(id), 19, 'rgb(' + ink + ')', 'left');
      C.label(ctx, X[1], y, dzh(z.A), 19, 'rgb(' + ink + ')', 'right');
      C.label(ctx, X[2], y, dzh(z.Q), 19, 'rgb(' + ink + ')', 'right');
      C.label(ctx, X[3], y, dzh(z.dU), 19, 'rgb(' + ink + ')', 'right');
      C.label(ctx, X[4], y, num(z.S, 3), 19, 'rgb(' + ink + ')', 'right');
    });
    C.label(ctx, 990, 300, 'теплота от пути зависит,', 17, mut, 'right');
    C.label(ctx, 990, 322, 'теплота, делённая на T, нет', 17, mut, 'right');
  }

  /* Шаг сетки: 1, 2 или 5 на степень десяти, делений не больше n. */
  function shagOsi(max, n) {
    var s = Math.pow(10, Math.floor(Math.log10(max / n))), mn = [2, 2.5, 2], j = 0;
    while (max / s > n) { s *= mn[j % 3]; j++; }
    return s;
  }

  /* Рамка P–V цикла по узлам обоих газов: смена газа масштаба не меняет. */
  function vidCikla(m) {
    var maxV = 0, maxP = 0;
    [m.cikl, m.drugoj].forEach(function (p) {
      p.otrezki.forEach(function (s) {
        for (var k = 0; k <= s.K; k++) { if (s.V[k] > maxV) maxV = s.V[k]; if (s.P[k] > maxP) maxP = s.P[k]; }

  /* Рамка T–S по путям: T от нуля, чтобы площадь под линией была теплотой;
     S − S₁ с запасом слева под подписи температур. */
  function vidTS(puti) {
    var a = 0, b = 0, Tm = 0;
    puti.forEach(function (p) {
      var off = 0;
      p.otrezki.forEach(function (s) {
        for (var k = 0; k <= s.K; k++) {

          if (Sk < a) a = Sk; if (Sk > b) b = Sk; if (s.Tu[k] > Tm) Tm = s.Tu[k];
        }

    return {
      a: a, b: b, Tm: Tm, shS: shagOsi(b - a, 5), shT: shagOsi(Tm, 5),
      X: function (Sv) { return TS_X0 + (Sv - a) / (b - a) * (TS_X1 - TS_X0); },
      Y: function (T) { return TS_Y1 - T / Tm * (TS_Y1 - TS_Y0); }
    };
  }

  function osiTS(ctx, w, ink, mut) {

  /* Цикл на P–V: оси по обоим газам, у одного резервуара его изотерма

  function postavitN(n, nabor) {

    var raz = c.g.i === 3 ? [c, d] : [d, c];
    if (!S.nazad) {
      txt = 'Цикл Карно между ' + num(S.tH, 0) + ' и ' + num(S.tX, 0) + ' °C. На горячей изотерме газ берёт Q_H = ' + J(c.QH) + ', на холодной отдаёт |Q_X| = ' +
        J(-c.QX) + ', на адиабатах тепла нет. Работа за цикл ' + J(c.A) + ', КПД A/Q_H = ' + A(num(c.A / c.Qp, 4)) + ', и 1 − T_X/T_H даёт то же. ' +
        'У одноатомного газа адиабата растягивает объём в ' + gV(raz[0]) + ' раза, у двухатомного в ' + gV(raz[1]) +
        ': циклы на P–V разные (второй газ пунктиром), а теплоты, работа и КПД у них одни. Отношение теплот |Q_X|/Q_H = ' + A(num(-c.QX / c.QH, 4)) +
        ', то же, что T_X/T_H по газовой шкале. Для газа это счёт; что так у любого тела, доказывает теорема Карно.';
      if (S.ts) txt += ' На панели T–S цикл прямоугольник: изотермы горизонтальны, адиабаты вертикальны, ширина ' + A(num(c.shirina, 3) + ' Дж/К') +
        ', и у обоих газов он один. Площадь внутри есть работа, под верхней стороной Q_H, под нижней |Q_X|. S набрана суммой δQ/T по шагам; ' +
        'формула C_V ln(T/T₁) + νR ln(V/V₁) в углах расходится с ней не больше чем на ' + stepen(pokaz.SformulaDev || 0) + ' Дж/К.';
    } else {
      txt = 'Цикл Карно назад. Газ берёт у холодного резервуара ' + J(c.Qp) + ', над ним совершают работу ' + J(-c.A) + ', и горячему он отдаёт ' + J(-c.Qm) +
        '. Как холодильная машина цикл даёт COP = Q_X/A = ' + A(num(c.Qp / -c.A, 3)) + ', как насос Q_H/A = ' + A(num(-c.Qm / -c.A, 3)) +
        ', ровно на единицу больше; T_X/(T_H − T_X) и T_H/(T_H − T_X) дают те же числа. При 25 °C в кухне и 5 °C в камере предел бытового холодильника 13,9, ' +
        'в доме при 20 °C и на улице при 0 °C предел насоса 14,7.';
      if (S.ts) txt += ' На панели T–S тот же прямоугольник обходится против часовой стрелки, и площадь внутри теперь работа над газом.';
    }
    return sub(txt);
  }

  function slova10() {
    if (S.rezhim === 'cikl') return slovaCikla();
    if (S.rezhim === 'politropa') return slovaPolitropy();
    return slovaPutej() + slovaPutej10();
  }

  /* Рейка десятой недели: четыре режима, ручки цикла, вторая панель. */
  function rejka10() {
    var odin = S.rezhim === 'cikl' && S.cikl === 'odin', kar = S.rezhim === 'cikl' && S.cikl === 'karno';
    var pol = S.rezhim === 'politropa', puti = S.rezhim === 'puti';
    var nPoz = S.n === Infinity ? N_MAX + 0.05 : S.n;
    var konecTxt = S.n === Infinity ? kPa(NU * R * T_1 / S.V2) + ' кПа' : litr(S.V2) + ' л';
    var gr = function (t) { return num(t, 0) + ' °C'; };
    return html`
      <div class="controls">
        <${C.Group} label="Режим:">
          <${C.Btn} active=${odin} onClick=${function () { vybratCikl('odin'); }}>один резервуар<//>
          <${C.Btn} active=${kar} onClick=${function () { vybratCikl('karno'); }}>Карно<//>
          <${C.Btn} active=${puti} onClick=${function () { vybratRezhim('puti'); }}>три пути<//>
          <${C.Btn} active=${pol} onClick=${function () { vybratRezhim('politropa'); }}>политропы<//>
        <//>
        ${kar ? html`
          <${C.Group}>
            <${C.Btn} active=${S.nazad} onClick=${function () { vybratHod(!S.nazad); }}>обратный ход<//>
          <//>
          <${C.Slider} label=${html`T<sub>H</sub>:`} min=${10} max=${150} step=${1} value=${S.tH}
                       onChange=${function (v) { dvigatT('H', v); }} display=${gr(S.tH)} />
          <${C.Slider} label=${html`T<sub>X</sub>:`} min=${-30} max=${90} step=${1} value=${S.tX}
                       onChange=${function (v) { dvigatT('X', v); }} display=${gr(S.tX)} />` : null}
        ${odin ? html`
          <${C.Slider} label="V₂/V₁:" min=${2} max=${8} step=${0.1} value=${S.rO}
                       onChange=${dvigatR} display=${num(S.rO, 1)} />` : null}
        ${pol ? html`
          <${C.Group} label="Процесс:">
            <${C.Btn} active=${S.nabor === 'izobara'} onClick=${function () { nabor('izobara'); }}>изобара<//>
            <${C.Btn} active=${S.nabor === 'izoterma'} onClick=${function () { nabor('izoterma'); }}>изотерма<//>
            <${C.Btn} active=${S.nabor === 'adiabata'} onClick=${function () { nabor('adiabata'); }}>адиабата<//>
            <${C.Btn} active=${S.nabor === 'izohora'} onClick=${function () { nabor('izohora'); }}>изохора<//>
          <//>
          <${C.Slider} label="n:" min=${N_MIN} max=${N_MAX + 0.05} step=${0.05} value=${nPoz}
                       onChange=${dvigatN} display=${S.n === Infinity ? '∞' : num(S.n, 2)} />
          <${C.Slider} label="Конец:" min=${V2_MIN / LITR} max=${V2_MAX / LITR} log=${true} value=${S.V2 / LITR}
                       onChange=${dvigatV2} display=${konecTxt} />` : null}
        ${puti ? html`
          <${C.Group} label="Путь:">
            <${C.Btn} active=${S.put === 1} onClick=${function () { vybratPut(1); }}>путь 1<//>
            <${C.Btn} active=${S.put === 2} onClick=${function () { vybratPut(2); }}>путь 2<//>
            <${C.Btn} active=${S.put === 3} onClick=${function () { vybratPut(3); }}>путь 3<//>
            <${C.Btn} active=${S.put === 'vse'} onClick=${function () { vybratPut('vse'); }}>все три<//>
            <${C.Btn} active=${S.put === 'cikl'} onClick=${function () { vybratPut('cikl'); }}>цикл<//>
          <//>` : null}
        <${C.Group} label="Газ:">
          <${C.Btn} active=${S.i === 3} onClick=${function () { vybratGaz(3); }}>i = 3<//>
          <${C.Btn} active=${S.i === 5} onClick=${function () { vybratGaz(5); }}>i = 5<//>
        <//>
        <${C.Group} label="Диаграммы:">
          <${C.Btn} active=${!S.ts} onClick=${function () { vybratTS(false); }}>P–V<//>
          <${C.Btn} active=${S.ts} onClick=${function () { vybratTS(true); }}>P–V и T–S<//>
        <//>
        <${C.Group}>
          <${C.Btn} action=${true} onClick=${pustit}>${S.idet ? 'Стоп' : 'Пустить поршень'}<//>
        <//>
      </div>`;
  }

  if (NEDELYA10) return html`
    <div class="demo">
      ${rejka10()}
      <canvas class="stage" ref=${ref}></canvas>
      <${C.Status} html=${slova10()} />
    </div>`;

  function slovaPutej() {
    var A = function (x) { return '<span class="accent">' + x + '</span>'; }, J = function (x) { return A(dzh(x) + ' Дж'); };
    var m = model(), T = num(m.T, 1) + ' К';
    if (S.dolya < 1) {
      var p0 = tekPuti(m)[0], z = naHodu(p0, S.dolya);
      return 'Поршень идёт: V = ' + litr(z.V) + ' л, P = ' + kPa(z.P) + ' кПа, T = ' + num(z.T, 1) + ' К. Набрано A = ' + dzh(z.A) +
        ' Дж, ΔU = ' + dzh(z.dU) + ' Дж, Q = ' + dzh(z.Q) + ' Дж.';
    }
    var o = function (id, j) { return m[id].otrezki[j]; }, Qs = function (s) { return dzh(Math.abs(s.Q[s.K])) + ' Дж'; };
    if (S.put === 1)
      return 'Путь 1: изобара при 200 кПа, затем изохора при 20 л. Работу газ совершает только на изобаре, ' + J(m[1].A) +
        ', площадь прямоугольника. Теплота по отрезкам идёт в обе стороны: на изобаре газ получает ' + A(Qs(o(1, 0))) + ' и греется до ' +
        num(m.Tugly[0], 1) + ' К, на изохоре отдаёт ' + A(Qs(o(1, 1))) + ' и остывает до ' + T + '. Концы лежат на одной изотерме, поэтому ΔU = 0 и Q = A = ' + J(m[1].Q) + '.';
    if (S.put === 2)
      return 'Путь 2: изотерма ' + T + '. Температура стоит, ΔU = 0 на каждом шаге, и вся полученная теплота уходит в работу: Q = A = ' + J(m[2].A) + ', это νRT ln 2.';
    if (S.put === 3)
      return 'Путь 3: изохора при 10 л, затем изобара при 100 кПа. На изохоре газ отдаёт ' + A(Qs(o(3, 0))) + ' и остывает до ' + num(m.Tugly[1], 1) +
        ' К, на изобаре получает ' + A(Qs(o(3, 1))) + ' и совершает работу ' + J(m[3].A) + '. Итог Q = A = ' + J(m[3].Q) + ' при том же ΔU = 0.';
    if (S.put === 'vse')
      return 'Три пути между одними состояниями: работа ' + A(dzh(m[1].A)) + ', ' + A(dzh(m[2].A)) + ' и ' + A(dzh(m[3].A) + ' Дж') +
        ', теплота столько же, а ΔU = 0 у всех трёх. Внутренняя энергия принадлежит состоянию, работа и теплота переходу: при тех же концах они зависят от пути. ' +
        'Площадь под путём 3 лежит внутри площади под изотермой, та внутри площади под путём 1.';
    var c = m.cikl;
    return 'Туда путём 1, обратно путём 3: газ вернулся в состояние 1, ΔU = 0. Работа за цикл ' + J(c.A) +
      ', площадь внутри цикла: расширяясь при 200 кПа, газ отдаёт поршню ' + dzh(c.otrezki[0].A[c.otrezki[0].K]) +
      ' Дж работы, а сжимая газ при 100 кПа, поршень возвращает ему ' + dzh(-c.otrezki[2].A[c.otrezki[2].K]) + ' Дж. Оплачена работа теплотой: газ получил ' + J(c.Qp) + ', отдал ' + dzh(-c.Qm) + ' Дж, разница ' + J(c.Q) +
      '. Машина, которая давала бы работу на цикле без теплоты, была бы вечным двигателем первого рода.';
  }

  var pol = S.rezhim === 'politropa', g = gaz(S.i);
  var nPoz = S.n === Infinity ? N_MAX + 0.05 : S.n;
  var konecTxt = S.n === Infinity ? kPa(NU * R * T_1 / S.V2) + ' кПа' : litr(S.V2) + ' л';
  return html`
    <div class="demo">
      <div class="controls">
        <${C.Group} label="Режим:">
          <${C.Btn} active=${pol} onClick=${function () { vybratRezhim('politropa'); }}>политропы<//>
          <${C.Btn} active=${!pol} onClick=${function () { vybratRezhim('puti'); }}>три пути<//>
        <//>
        ${pol ? html`
          <${C.Group} label="Процесс:">
            <${C.Btn} active=${S.nabor === 'izobara'} onClick=${function () { nabor('izobara'); }}>изобара<//>
            <${C.Btn} active=${S.nabor === 'izoterma'} onClick=${function () { nabor('izoterma'); }}>изотерма<//>
            <${C.Btn} active=${S.nabor === 'adiabata'} onClick=${function () { nabor('adiabata'); }}>адиабата<//>
            <${C.Btn} active=${S.nabor === 'izohora'} onClick=${function () { nabor('izohora'); }}>изохора<//>
          <//>
          <${C.Slider} label="n:" min=${N_MIN} max=${N_MAX + 0.05} step=${0.05} value=${nPoz}
                       onChange=${dvigatN} display=${S.n === Infinity ? '∞' : num(S.n, 2)} />
          <${C.Slider} label="Конец:" min=${V2_MIN / LITR} max=${V2_MAX / LITR} log=${true} value=${S.V2 / LITR}
                       onChange=${dvigatV2} display=${konecTxt} />` : html`
          <${C.Group} label="Путь:">
            <${C.Btn} active=${S.put === 1} onClick=${function () { vybratPut(1); }}>путь 1<//>
            <${C.Btn} active=${S.put === 2} onClick=${function () { vybratPut(2); }}>путь 2<//>
            <${C.Btn} active=${S.put === 3} onClick=${function () { vybratPut(3); }}>путь 3<//>
            <${C.Btn} active=${S.put === 'vse'} onClick=${function () { vybratPut('vse'); }}>все три<//>
            <${C.Btn} active=${S.put === 'cikl'} onClick=${function () { vybratPut('cikl'); }}>цикл<//>
          <//>`}
        <${C.Group} label="Газ:">
          <${C.Btn} active=${S.i === 3} onClick=${function () { vybratGaz(3); }}>i = 3<//>
          <${C.Btn} active=${S.i === 5} onClick=${function () { vybratGaz(5); }}>i = 5<//>
        <//>
        <${C.Group}>
          <${C.Btn} action=${true} onClick=${pustit}>${S.idet ? 'Стоп' : 'Пустить поршень'}<//>
        <//>
      </div>
      <canvas class="stage" ref=${ref}></canvas>
      <${C.Status} html=${pol ? slovaPolitropy() : slovaPutej()} />
    </div>`;
}

C.mount(PV);
</script>
</body>
</html>
