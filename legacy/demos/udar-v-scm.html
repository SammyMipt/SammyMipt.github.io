<script>
'use strict';
var C = window.DemoCore, html = C.html;
var useRef = React.useRef, useState = React.useState;

/* ══════════════════ физика ══════════════════

   Держит второй акт недели: блоки `tipy-stolknovenij`, `uprugij-udar-1d`,
   `sistema-centra-mass`, `predelnyj-ugol`, `porogovaya-energiya`.
   Написана генеральной сессией 15.09 (билдера оборвал лимит), бриф
   briefs/demki_nedelya04.md, № 5.

   МОДЕЛЬ. Две гладкие шайбы: налетающая массы m₁ со скоростью v₁ вдоль
   оси x, покоящаяся массы m₂. Центр покоящейся в начале координат,
   налетающая идёт по прямой y = b, где b есть прицельное расстояние в
   долях суммы радиусов R, от 0 до 0,99. В момент касания линия центров
   n̂ = (√(1 − b²), −b). Удар мгновенный и гладкий: касательная к n̂
   составляющая относительной скорости не меняется, нормальная меняет
   знак и умножается на коэффициент восстановления e. Скорости после
   удара собираются из скорости центра масс, которую удар не трогает, и
   новой относительной скорости:
       v₁′ = V + m₂/(m₁ + m₂)·v′отн,   v₂′ = V − m₁/(m₁ + m₂)·v′отн,
   поэтому импульс пары сохраняется по построению и MV²/2 не меняется
   ни в одном ударе. Меняется только K_отн = μv²отн/2, μ = m₁m₂/(m₁ + m₂).

   РЕАКЦИЯ. В режиме реакции удар лобовой и забирает энергию Q, если
   K_отн ≥ Q: нормальная относительная скорость после удара такая, что
   μ(v² − v′²)/2 = Q. Если энергии не хватает, шайбы отскакивают упруго.
   Продукты реакции модель не различает, массы после удара те же; для
   порога это не важно: на пороге оба тела после удара идут со скоростью
   центра масс. Порог для налетающей K_пор = Q(1 + m₁/m₂).

   УГЛЫ снимаются с векторов после удара: отклонение налетающей и
   направление отдачи в лабораторной системе, поворот скорости налетающей
   в системе центра масс. При m₁ > m₂ отклонение не больше arcsin(m₂/m₁).

   ПРЕСЕТЫ из главы: машина 1000 кг и грузовик 10 т, сближение 100 км/ч,
   слипание, в тепло 350,7 кДж, кто бы ни ехал; α-частица на электроне,
   отношение масс 7294, предельный угол 0,0079°; равные массы, упругий
   нецентральный удар, угол между скоростями после удара прямой; порог
   реакции ¹⁴N(α, p)¹⁷O: массы 4,0026 и 14,0031 а.е.м., Q = 1,19 МэВ,
   порог 1,530 МэВ, на пороге в реакцию уходит 78 процентов энергии
   налетающей. Энергии «равных масс» и «α на электроне» в условных
   единицах: массы в массах лёгкой шайбы, v₁ = 1. */

var PRESETY = [
  { imya: 'равные массы', m1: 1, m2: 1, v1: 1, b: 0.5, e: 1, rezh: 'udar', ed: 'усл.' },
  { imya: 'машина и грузовик', m1: 1000, m2: 10000, v1: 100 / 3.6, b: 0, e: 0, rezh: 'udar', ed: 'кДж' },
  { imya: 'α на электроне', m1: 7294, m2: 1, v1: 1, b: 0.5, e: 1, rezh: 'udar', ed: 'усл.' },
  { imya: 'порог реакции', m1: 4.0026, m2: 14.0031, K1: 1.3, Q: 1.19, b: 0, e: 1, rezh: 'reakciya', ed: 'МэВ' }
];

function sub(a, b) { return [a[0] - b[0], a[1] - b[1]]; }
function add(a, b) { return [a[0] + b[0], a[1] + b[1]]; }
function mul(a, k) { return [a[0] * k, a[1] * k]; }
function dot(a, b) { return a[0] * b[0] + a[1] * b[1]; }
function len(a) { return Math.sqrt(dot(a, a)); }
function mezhduGrad(a, b) {
  var c = dot(a, b) / (len(a) * len(b));
  return Math.acos(Math.max(-1, Math.min(1, c))) * 180 / Math.PI;
}

/* Исход удара. p: m1, m2, v1, b (доля суммы радиусов), e, rezh, Q. */
function iskhod(p) {
  var m1 = p.m1, m2 = p.m2, M = m1 + m2, mu = m1 * m2 / M;
  var reakc = p.rezh === 'reakciya';
  var v1 = [p.v1, 0];
  var V = mul(v1, m1 / M);                                    /* вторая шайба покоится */
  var b = reakc ? 0 : p.b;
  var n = [Math.sqrt(Math.max(0, 1 - b * b)), -b];            /* линия центров от первой ко второй */
  var vn = dot(v1, n), vt = sub(v1, mul(n, vn));              /* относительная скорость равна v₁ */
  var vnPosle, poshla = false;
  if (reakc) {
    var ost = vn * vn - 2 * p.Q / mu;
    if (ost >= 0) { vnPosle = -Math.sqrt(ost); poshla = true; } else vnPosle = -vn;
  } else vnPosle = -p.e * vn;
  var vrel = add(vt, mul(n, vnPosle));
  var v1p = add(V, mul(vrel, m2 / M)), v2p = sub(V, mul(vrel, m1 / M));
  var pDo = mul(v1, m1), pPosle = add(mul(v1p, m1), mul(v2p, m2));
  var Vp = mul(pPosle, 1 / M);
  var KrelDo = mu * p.v1 * p.v1 / 2, KrelPosle = mu * dot(vrel, vrel) / 2;
  var u1 = sub(v1, V), u1p = sub(v1p, V), nol = 1e-9 * p.v1;
  return {
    m1: m1, m2: m2, v1: p.v1, b: b, e: reakc ? null : p.e, Q: reakc ? p.Q : null,
    V: V, v1p: v1p, v2p: v2p,
    KCM: M * dot(V, V) / 2, KCMafter: M * dot(Vp, Vp) / 2,
    KrelBefore: KrelDo, KrelAfter: KrelPosle,
    heat: reakc ? 0 : KrelDo - KrelPosle,
    reaction: poshla, Qspent: poshla ? p.Q : 0,
    K1: m1 * p.v1 * p.v1 / 2,
    thetaLab1: len(v1p) > nol ? mezhduGrad(v1, v1p) : null,
    thetaLab2: len(v2p) > nol ? mezhduGrad(v1, v2p) : null,
    angleBetween: len(v1p) > nol && len(v2p) > nol ? mezhduGrad(v1p, v2p) : null,
    thetaCM: len(u1p) > nol ? mezhduGrad(u1, u1p) : null,
    thetaMax: m1 > m2 ? Math.asin(m2 / m1) * 180 / Math.PI : null,
    Kthreshold: reakc ? p.Q * (1 + m1 / m2) : null,
    momentumError: len(sub(pPosle, pDo)) / len(pDo)
  };
}

/* ══════════════════ сцена ══════════════════

   Слева шайбы в выбранной системе отсчёта со стрелками скоростей и
   кольцом центра масс; удар в момент t = 0. Справа окружность скоростей
   в лабораторной системе: вектор скорости центра масс, окружность
   радиуса скорости налетающей в системе центра масс вокруг его конца и
   после удара векторы v₁′ и v₂′. Внизу счёт энергии; то, что после
   удара, появляется в момент удара. */

var W = 1000, HGT = 440;
var SX1 = 640, SY1 = 290;                /* поле сцены: за краем шайбы гаснут */
var SCX = 330, SCY = 150;                /* место удара */
var RS = 46;                             /* сумма радиусов на экране, единица b */
var VSC = 150;                           /* пикселей в секунду у налетающей в лаб. системе */
var T0 = -1.3, T1 = 1.7;                 /* с, окно проигрыша */
var DO = [800, 150], DK = 120;           /* диаграмма скоростей: начало и длина v₁ */
var TAU = 2 * Math.PI;
var ORAN = '224,138,82', GOLUB = '77,182,198';

function num(v, d) {
  if (v == null) return '—';
  if (Math.abs(v) < 0.5 * Math.pow(10, -d)) v = 0;
  return v.toFixed(d).replace('.', ',').replace('-', '−');
}
function celoe(v) { return String(Math.round(v)).replace(/\B(?=(\d{3})+(?!\d))/g, ' '); }
function otnStr(r) { return r >= 100 ? celoe(r) : num(r, r >= 10 ? 1 : 2); }
function grad(v) { return v == null ? '—' : num(v, v < 1 ? 4 : 1) + '°'; }
function radiusy(m1, m2) { return m1 > m2 * 1.001 ? [28, 18] : m2 > m1 * 1.001 ? [18, 28] : [23, 23]; }

function Udar() {
  var ref0 = useRef(null);
  if (!ref0.current) ref0.current = { preset: 0, p: Object.assign({}, PRESETY[0]), scm: false, t: T0, run: false, sv: null };
  var S = ref0.current;
  var pair = useState(0), bump = function () { pair[1](function (k) { return k + 1; }); };

  function parametry() {
    var p = Object.assign({}, S.p);
    if (p.rezh === 'reakciya') p.v1 = Math.sqrt(2 * p.K1 / p.m1);
    return p;
  }
  function pokazaniya() {
    var r = iskhod(parametry());
    r.frame = S.scm ? 'центр масс' : 'лабораторная';
    r.t = S.t; r.run = S.run; r.preset = PRESETY[S.preset].imya;
    S.sv = r; window.__demoState = r;
  }
  if (!S.sv) pokazaniya();

  function step(dt) {
    if (!S.run) return;
    var bylo = S.t;
    S.t = Math.min(T1, S.t + dt);
    if (S.t >= T1) S.run = false;
    pokazaniya();
    if (!S.run || (bylo < 0 && S.t >= 0)) bump();
  }

  function draw(ctx) {
    var tone = C.tones(ctx);
    var ink = tone.ink, muted = tone.muted, acc = tone.accent;
    var r = S.sv, p = parametry(), ed = PRESETY[S.preset].ed, posle = S.t >= 0;
    var mut = 'rgba(' + muted + ',.95)';
    var ks = VSC / p.v1, t = S.t, RR = radiusy(p.m1, p.m2);
    var dx = Math.sqrt(Math.max(0, 1 - r.b * r.b)) * RS, by = r.b * RS;
    var Vk = S.scm ? r.V : [0, 0];                    /* скорость системы отсчёта */
    var p1, p2, w1, w2;
    if (!posle) { p1 = [-dx + p.v1 * ks * t, by]; p2 = [0, 0]; w1 = [p.v1, 0]; w2 = [0, 0]; }
    else {
      p1 = [-dx + r.v1p[0] * ks * t, by + r.v1p[1] * ks * t];
      p2 = [r.v2p[0] * ks * t, r.v2p[1] * ks * t];
      w1 = r.v1p; w2 = r.v2p;
    }
    function ex(x) { return SCX + x - Vk[0] * ks * t; }
    function ey(y) { return SCY - y + Vk[1] * ks * t; }
    function strelka(x, y, v, col) {
      var vx = (v[0] - Vk[0]) * ks * 0.45, vy = (v[1] - Vk[1]) * ks * 0.45;
      if (Math.hypot(vx, vy) < 4) return;
      ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + vx, y - vy); ctx.stroke();
      var a = Math.atan2(-vy, vx);
      ctx.beginPath(); ctx.moveTo(x + vx, y - vy);
      ctx.lineTo(x + vx - 11 * Math.cos(a - 0.4), y - vy - 11 * Math.sin(a - 0.4));
      ctx.lineTo(x + vx - 11 * Math.cos(a + 0.4), y - vy - 11 * Math.sin(a + 0.4));
      ctx.closePath(); ctx.fill();
    }

    /* сцена */
    ctx.save();
    ctx.beginPath(); ctx.rect(0, 0, SX1, SY1); ctx.clip();
    if (!S.scm && r.b > 0) {
      /* прицельное расстояние: линия налёта и ось через покоящуюся шайбу */
      ctx.save(); ctx.setLineDash([5, 6]);
      ctx.strokeStyle = 'rgba(' + muted + ',.5)'; ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.moveTo(30, ey(by)); ctx.lineTo(ex(0), ey(by));
      ctx.moveTo(30, ey(0)); ctx.lineTo(ex(0), ey(0)); ctx.stroke();
      ctx.restore();
      if (by > 14) C.label(ctx, 44, (ey(by) + ey(0)) / 2 + 6, 'b', 17, mut, 'left');
    }
    var xc = (p.m1 * p1[0] + p.m2 * p2[0]) / (p.m1 + p.m2), yc = (p.m1 * p1[1] + p.m2 * p2[1]) / (p.m1 + p.m2);
    ctx.fillStyle = 'rgba(' + ORAN + ',.9)';
    ctx.beginPath(); ctx.arc(ex(p1[0]), ey(p1[1]), RR[0], 0, TAU); ctx.fill();
    ctx.fillStyle = 'rgba(' + GOLUB + ',.9)';
    ctx.beginPath(); ctx.arc(ex(p2[0]), ey(p2[1]), RR[1], 0, TAU); ctx.fill();
    ctx.strokeStyle = 'rgb(' + ink + ')'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(ex(xc), ey(yc), 6, 0, TAU); ctx.stroke();
    strelka(ex(p1[0]), ey(p1[1]), w1, 'rgb(' + ORAN + ')');
    strelka(ex(p2[0]), ey(p2[1]), w2, 'rgb(' + GOLUB + ')');
    ctx.restore();
    C.label(ctx, 30, 30, S.scm ? 'система центра масс' : 'лабораторная система', 18, mut, 'left');
    var par;
    if (ed === 'кДж') par = 'm₁ = ' + celoe(p.m1) + ' кг, m₂ = ' + celoe(p.m2) + ' кг';
    else if (ed === 'МэВ') par = 'm₁ = 4,0026 а.е.м., m₂ = 14,0031 а.е.м., Q = ' + num(p.Q, 2) + ' МэВ';
    else par = 'm₁/m₂ = ' + otnStr(p.m1 / p.m2);
    if (p.rezh !== 'reakciya') par += ', e = ' + num(p.e, 2) + ', b = ' + num(r.b, 2) + ' R';
    C.label(ctx, 30, 312, par, 17, mut, 'left');

    /* окружность скоростей, лабораторная система */
    var k = DK / p.v1;
    function dxp(v) { return DO[0] + v[0] * k; }
    function dyp(v) { return DO[1] - v[1] * k; }
    function vektor(v, col, w) {
      ctx.strokeStyle = col; ctx.lineWidth = w;
      ctx.beginPath(); ctx.moveTo(DO[0], DO[1]); ctx.lineTo(dxp(v), dyp(v)); ctx.stroke();
      ctx.fillStyle = col; ctx.beginPath(); ctx.arc(dxp(v), dyp(v), 4, 0, TAU); ctx.fill();
    }
    ctx.strokeStyle = 'rgba(' + ink + ',.4)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(dxp(r.V), dyp(r.V), Math.max(1.5, (p.v1 - r.V[0]) * k), 0, TAU); ctx.stroke();
    vektor([p.v1, 0], 'rgba(' + ORAN + ',.35)', 2);
    if (posle) { vektor(r.v2p, 'rgb(' + GOLUB + ')', 2.5); vektor(r.v1p, 'rgb(' + ORAN + ')', 2.5); }
    vektor(r.V, 'rgb(' + ink + ')', 2);
    C.label(ctx, 820, 312, 'окружность упругих исходов', 17, mut);
    var pod;
    if (p.rezh === 'reakciya') pod = 'порог налетающей ' + num(r.Kthreshold, 3) + ' МэВ';
    else if (posle && r.thetaLab1 != null) pod = 'налетающая отклонилась на ' + grad(r.thetaLab1);
    else pod = r.thetaMax != null ? 'угол не больше ' + grad(r.thetaMax) : '';
    C.label(ctx, 820, 336, pod, 17, mut);

    /* счёт энергии */
    var f = ed === 'кДж' ? 1e-3 : 1, d = ed === 'кДж' ? 1 : 3, u = ed === 'усл.' ? '' : ', ' + ed;
    function E(v, vsegda) { return posle || vsegda ? num(v * f, d) : '—'; }
    var y0 = 372;
    C.readout(ctx, 215, y0, 'MV²/2 до и после' + u, E(r.KCM, true), 'rgb(' + ink + ')');
    C.readout(ctx, 465, y0, 'K отн до' + u, E(r.KrelBefore, true), 'rgb(' + acc + ')');
    C.readout(ctx, 715, y0, 'K отн после' + u, E(r.KrelAfter), 'rgb(' + acc + ')');
    if (p.rezh === 'reakciya') C.readout(ctx, 965, y0, 'в реакцию' + u, posle ? num(r.Qspent, 2) : '—', 'rgb(' + ORAN + ')');
    else C.readout(ctx, 965, y0, 'во внутр. энергию' + u, E(r.heat), 'rgb(' + ORAN + ')');
  }

  var ref = C.useStage(W, HGT, step, draw);

  window.__demoModel = { iskhod: iskhod, PRESETY: PRESETY };
  window.__demoRun = function (q) {
    var p = Object.assign({ v1: 1, b: 0, e: 1, rezh: 'udar' }, q);
    if (p.rezh === 'reakciya' && p.K1 != null) p.v1 = Math.sqrt(2 * p.K1 / p.m1);
    return iskhod(p);
  };

  function zanovo() { S.t = T0; S.run = false; pokazaniya(); bump(); }
  function preset(i) { S.preset = i; S.p = Object.assign({}, PRESETY[i]); S.izmeneno = false; zanovo(); }
  function pomenyat(key, v) { S.p[key] = v; S.izmeneno = true; zanovo(); }
  function otnoshenie(x) {
    if (Math.abs(Math.log10(x)) < 0.005) x = 1;
    S.p.m1 = x * S.p.m2; S.izmeneno = true; zanovo();
  }
  function kto() { var a = S.p.m1; S.p.m1 = S.p.m2; S.p.m2 = a; zanovo(); }
  function pusk() {
    if (S.t >= T1) S.t = T0;
    S.run = !S.run; pokazaniya(); bump();
  }
  function sistema(scm) { S.scm = scm; pokazaniya(); bump(); }

  function slova() {
    var A = function (s) { return '<span class="accent">' + s + '</span>'; };
    var r = S.sv, p = parametry(), i = S.preset, ed = PRESETY[i].ed;
    function E(v) { return ed === 'кДж' ? num(v / 1000, 1) + ' кДж' : ed === 'МэВ' ? num(v, 3) + ' МэВ' : num(v, 3); }
    if (S.t < 0) {
      if (S.izmeneno && p.rezh !== 'reakciya') return 'Налетающая шайба идёт на покоящуюся: m₁/m₂ = ' +
        otnStr(p.m1 / p.m2) + ', b = ' + num(p.b, 2) + ' R, e = ' + num(p.e, 2) + '. Кольцо отмечает центр масс. ' +
        '«Пуск» проигрывает удар.';
      return [
        'Две одинаковые шайбы, удар нецентральный.',
        'Машина 1000 кг и грузовик 10 т сближаются со скоростью 100 км/ч.',
        'α-частица тяжелее электрона в 7294 раза.',
        'α-частица налетает на покоящееся ядро азота; реакция ¹⁴N(α, p)¹⁷O забирает Q = 1,19 МэВ.'
      ][i] + ' Кольцо отмечает центр масс. «Пуск» проигрывает удар.';
    }
    if (p.rezh === 'reakciya') {
      if (r.reaction) return 'Энергия налетающей ' + A(E(r.K1)) + ' не ниже порога ' + A(E(r.Kthreshold)) +
        ': реакция идёт и забирает ' + A(E(p.Q)) + ' из энергии относительного движения. ' +
        'Энергию движения центра масс, ' + A(E(r.KCM)) + ', держит импульс.';
      return 'Энергия налетающей ' + A(E(r.K1)) + ' ниже порога ' + A(E(r.Kthreshold)) +
        ': на реакцию есть только энергия относительного движения, ' + A(E(r.KrelBefore)) +
        ', и её меньше, чем Q. Ядра расходятся упруго. На пороге в реакцию уходит ' +
        A(Math.round(100 * p.m2 / (p.m1 + p.m2)) + ' процентов') + ' энергии налетающей, остальное держит импульс.';
    }
    if (p.e === 0 && r.b === 0) return 'Шайбы слиплись: в системе центра масс они остановились, и вся энергия ' +
      'относительного движения, ' + A(E(r.heat)) + ', ушла во внутреннюю энергию шайб. Энергия движения центра масс осталась прежней, ' +
      A(E(r.KCM)) + '.' + (i === 1 ? ' Поменяйте, кто едет: она станет другой, а потеря останется той же.' : '');
    if (p.e < 1) return 'Удар неупругий: энергия движения центра масс осталась прежней, ' + A(E(r.KCM)) +
      ', а из энергии относительного движения ' + A(E(r.KrelBefore)) + ' во внутреннюю энергию шайб ушло ' + A(E(r.heat)) + '.';
    var s = 'Удар упругий: энергия относительного движения не изменилась, в системе центра масс скорости ' +
      'только повернулись, на ' + A(grad(r.thetaCM)) + '.';
    if (r.thetaLab1 == null) s += ' Налетающая остановилась и отдала скорость целиком.';
    else if (r.thetaMax != null) s += ' Налетающая в лабораторной системе отклонилась на ' + A(grad(r.thetaLab1)) +
      '; при таком отношении масс больше ' + A(grad(r.thetaMax)) + ' не бывает.';
    else if (Math.abs(p.m1 - p.m2) < 1e-9 * p.m1 && r.angleBetween != null) s += ' Угол между скоростями после удара ' +
      A(grad(r.angleBetween)) + '.';
    else s += ' Налетающая отклонилась на ' + A(grad(r.thetaLab1)) + '.';
    return s;
  }

  var p = S.p, reakc = p.rezh === 'reakciya';
  return html`
    <div class="demo">
      <div class="controls">
        <${C.Group}>
          <${C.Btn} action=${true} onClick=${pusk}>${S.run ? 'Пауза' : 'Пуск'}<//>
        <//>
        <${C.Group} label="Опыт:">
          ${PRESETY.map(function (q, i) {
            return html`<${C.Btn} active=${S.preset === i} onClick=${function () { preset(i); }}>${q.imya}<//>`;
          })}
        <//>
        <${C.Group} label="Система:">
          <${C.Btn} active=${!S.scm} onClick=${function () { sistema(false); }}>лабораторная<//>
          <${C.Btn} active=${S.scm} onClick=${function () { sistema(true); }}>центра масс<//>
        <//>
        ${reakc
          ? html`<${C.Slider} label="Энергия налетающей:" min=${0.5} max=${8} step=${0.01}
                              value=${p.K1} onChange=${function (v) { pomenyat('K1', v); }}
                              display=${num(p.K1, 2) + ' МэВ'} />`
          : html`<${C.Slider} label="m₁/m₂:" min=${0.01} max=${10000} step=${0.02} log=${true}
                              value=${p.m1 / p.m2} onChange=${otnoshenie} display=${otnStr(p.m1 / p.m2)} />
                 <${C.Slider} label="Прицельное расстояние:" min=${0} max=${0.99} step=${0.01}
                              value=${p.b} onChange=${function (v) { pomenyat('b', v); }}
                              display=${num(p.b, 2) + ' R'} />
                 <${C.Slider} label="Упругость e:" min=${0} max=${1} step=${0.05}
                              value=${p.e} onChange=${function (v) { pomenyat('e', v); }}
                              display=${num(p.e, 2)} />`}
        ${S.preset === 1 ? html`<${C.Group}><${C.Btn} onClick=${kto}>поменять, кто едет<//><//>` : null}
      </div>
      <canvas class="stage" ref=${ref}></canvas>
      <${C.Status} html=${slova()} />
    </div>`;
}

C.mount(Udar);
</script>
</body>
</html>
